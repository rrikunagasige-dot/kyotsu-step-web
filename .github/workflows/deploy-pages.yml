name: Deploy to GitHub Pages
on:
  push:
    branches: [main, work/w048-publisher-g3-20261105, work/w050-publisher-g3-20261106, work/w050-rollout-publisher-g3, work/w051-p005-publisher-draft]
    paths: ['.github/workflows/deploy-pages.yml', 'tools/release/w050-rollout-publish-check.mjs', 'tools/release/w050-rollout-release-contract.json', 'tools/release/w050-figure-readiness-original.py', 'tools/release/w050-rollout-browser.mjs', 'tools/release/w051-p005-*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify fixed candidate without uploading or deploying Pages
        type: boolean
        required: true
        default: true
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
      VITE_PREVIEW_COMMIT: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
      W051_SOURCE_QA_DIRECTORY: /tmp/w051-sourceqa-build
      W051_HISTORICAL_T_ROOT: ${{ github.workspace }}/historical-t
      W051_ORIGINAL_PUBLISHER_ROOT: ${{ github.workspace }}/historical-publisher
      W050_BASELINE_CHECKOUT: ${{ github.workspace }}/baseline-cb
      W050_SERVICE_ROOT: ${{ github.workspace }}/service-u
      W050_SERVICE_V_ROOT: ${{ github.workspace }}/service-v
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout publisher checks from reviewed publisher revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          sparse-checkout: |
            tools/release/w046-publish-check.mjs
            tools/release/w047-publish-check.mjs
            tools/release/w047-release-contract.json
            tools/release/w048-publish-check.mjs
            tools/release/w048-release-contract.json
            tools/release/w050-publish-check.mjs
            tools/release/w050-release-contract.json
            tools/release/w050-rollout-publish-check.mjs
            tools/release/w050-rollout-release-contract.json
            tools/release/w050-figure-readiness-original.py
            tools/release/w050-rollout-browser.mjs
            tools/release/w051-p005-publish-check.mjs
            tools/release/w051-p005-release-contract.json
            tools/release/w051-p005-native-proof.mjs
            tools/release/w051-p005-sourceqa.py
            tools/release/w051-p005-dist.mjs
            tools/release/w051-p005-hosted.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout immutable native service U two-file overlay only
        uses: actions/checkout@v4
        with:
          ref: 2d4de64a6da7aff1a36fa057c5e73d02c73c0d9b
          path: service-u
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools/textbook/operations.mjs
            tools/textbook/tests/operations-warning-resolutions.test.mjs
          sparse-checkout-cone-mode: false
      - name: Checkout immutable native service V full implementation closure
        uses: actions/checkout@v4
        with:
          ref: a4dad490daa3d1bf8f7011f2915342c543e8a79c
          path: service-v
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original CB for unchanged legacy guard execution
        uses: actions/checkout@v4
        with:
          ref: cb01da34c99005fde4a64fd932b31edeaa3790b3
          path: baseline-cb
          persist-credentials: false
      - name: Checkout original T for unchanged historical guards
        uses: actions/checkout@v4
        with:
          ref: 751b229cb7a99a6a5743b00c5b978c97585b4964
          path: historical-t
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original a425 tooling without modification
        uses: actions/checkout@v4
        with:
          ref: a425b357c5fb6e14de09743dcaf03d74e16c7244
          path: historical-publisher
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Connect unchanged historical dependency resolution
        run: |
          test ! -e historical-t/node_modules
          test ! -e baseline-cb/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" historical-t/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" baseline-cb/node_modules
      # W046 records the fixed candidate R07/G2 and scoped product checks; publication verifies bytes and operations again.
      - name: Existing Word source adapter dependency
        run: |
          set -euo pipefail
          packages=(pandoc fonts-noto-cjk)
          apt_net=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          fetch_packages() {
            timeout --kill-after=15s 120s sudo apt-get "${apt_net[@]}" -o APT::Update::Error-Mode=any update -qq &&
            timeout --kill-after=15s 240s sudo apt-get "${apt_net[@]}" install --download-only -y "${packages[@]}"
          }
          if ! fetch_packages; then
            # Official Ubuntu fallback in this disposable runner only; retain trust/suites/components.
            sudo python3 - <<'PY_APT'
          from pathlib import Path
          import hashlib,json,os,tempfile
          mirror=Path('/etc/apt/apt-mirrors.txt')
          assert mirror.is_file() and not mirror.is_symlink(), 'UNKNOWN_APT_MIRROR_FILE'
          sources=[Path('/etc/apt/sources.list')]+list(Path('/etc/apt/sources.list.d').glob('*.sources'))+list(Path('/etc/apt/sources.list.d').glob('*.list'))
          known=('mirror+file:/etc/apt/apt-mirrors.txt','mirror+file:///etc/apt/apt-mirrors.txt')
          assert any(any(uri in p.read_text() for uri in known) for p in sources if p.is_file() and not p.is_symlink()), 'UNOBSERVED_MIRROR_TRANSPORT_CONFIG'
          before=mirror.read_bytes()
          assert any(line.split()[0].rstrip('/') in (b'http://azure.archive.ubuntu.com/ubuntu',b'https://azure.archive.ubuntu.com/ubuntu') for line in before.splitlines() if line.strip() and not line.lstrip().startswith(b'#')), 'UNEXPECTED_MIRROR_LIST_NO_AZURE'
          fd,backup=tempfile.mkstemp(prefix='w050-apt-mirrors-',suffix='.before',dir='/tmp')
          with os.fdopen(fd,'wb') as f:
              f.write(before)
              f.flush()
              assert Path(backup).read_bytes()==before, 'MIRROR_BACKUP_BYTE_MISMATCH'
              os.fchmod(f.fileno(),0o644)
          assert Path(backup).stat().st_mode & 0o777 == 0o644, 'MIRROR_BACKUP_NOT_RUNNER_READABLE'
          after=b'https://archive.ubuntu.com/ubuntu/\n'
          mirror.write_bytes(after)
          assert mirror.read_bytes()==after and Path(backup).read_bytes()==before
          print(json.dumps({'scope':'DISPOSABLE_RUNNER_MAIN_MIRROR_ONLY','originalBackup':backup,'beforeSHA256':hashlib.sha256(before).hexdigest(),'afterSHA256':hashlib.sha256(after).hexdigest(),'officialFallback':'https://archive.ubuntu.com/ubuntu/','signedBySuitesComponentsChanged':False}))
          PY_APT
            fetch_packages
          fi
          # All network acquisition completed before dpkg; do not terminate unpacking to retry a mirror.
          timeout --kill-after=15s 180s sudo apt-get --no-download install -y "${packages[@]}"
          for package in "${packages[@]}"; do
            test "$(dpkg-query -W -f='${Status}' "$package")" = 'install ok installed'
          done
      - run: python -m pip install -r tools/textbook/research/requirements-solution.txt
      - run: node publisher/tools/release/w051-p005-publish-check.mjs retained-check
      - run: node publisher/tools/release/w051-p005-publish-check.mjs retained-048-bytes
      - run: node publisher/tools/release/w051-p005-publish-check.mjs bytes-only
      - name: Verify exact P003 only in external original-T tooling graph
        env:
          EVIDENCE_DIR: /tmp/w050-p003-regression-evidence
        run: node publisher/tools/release/w051-p005-publish-check.mjs p003-test
      - name: Verify exact P004 service V closure and twenty temp-only lock tests
        env:
          EVIDENCE_DIR: /tmp/w050-p004-regression-evidence
        run: node publisher/tools/release/w051-p005-publish-check.mjs p004-test
      - name: Retrieve immutable source-QA build and verify all four original slices
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_DIR: /tmp/w050-sourceqa-build
        run: node publisher/tools/release/w051-p005-publish-check.mjs retrieve-build
      - run: node work/items/W-MATH-003-numbers-expressions-creation/NE01_NE02/export-runtime.mjs
      - name: Append six manifests without rebuilding the immutable app
        run: node publisher/tools/release/w051-p005-publish-check.mjs manifest
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
      - name: Verify exact release before upload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('dist/release.json')),p=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/n08ConstructionPresentationR7.json'));
          if(m.sourceSHA!==process.env.CANDIDATE_SHA||m.work!=='W-MATH-041'||m.activeN08Revision!==7||m.construction.requiredParents!==30||m.construction.independentParts!==42||m.construction.planHash!==p.planHash||m.construction.layoutDesignHash!==p.layoutDesignHash||m.storageKey!==process.env.VITE_STORAGE_NAMESPACE||m.oldN08.revision!==4||m.originalN08.revision!==5||m.retainedN11!==JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/n11Transformation.json')).planHash)throw Error('RELEASE_CONTRACT_MISMATCH');
          NODE
      - name: Prepare exact external retained adapters including original N11 decode guard
        run: node publisher/tools/release/w051-p005-publish-check.mjs prepare-adapters
      - name: Verify candidate bytes and N09/N10 operations before publication
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vite preview --host 127.0.0.1 --port 4179 --strictPort > /tmp/w046-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w046-prepublish node publisher/tools/release/w051-p005-publish-check.mjs retained-046
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w046-prepublish-n08 node work/items/W-MATH-041-n08-inline-derivation-alignment/verify_app.mjs
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w046-prepublish-r6 node work/items/W-MATH-041-n08-inline-derivation-alignment/verify_revision6.mjs
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w046-prepublish-legacy node work/items/W-MATH-040-n08-construction-layout/verify_legacy.mjs
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w047-prepublish node publisher/tools/release/w051-p005-publish-check.mjs retained-047
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w048-prepublish node publisher/tools/release/w051-p005-publish-check.mjs retained-048
          APP_URL=http://127.0.0.1:4179/kyotsu-step-web/ EVIDENCE_DIR=/tmp/w050-prepublish node publisher/tools/release/w051-p005-publish-check.mjs verify-focused
      - uses: actions/upload-pages-artifact@v3
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        with:
          path: ./dist
      - name: Publish approved N11/N12 candidate with retained N08 and N09/N10
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published N09/N10 bytes and operations
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: /tmp/w046-hosted
        run: node publisher/tools/release/w051-p005-publish-check.mjs retained-046
      - name: Verify public source and N08 operations
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const sha=body=>createHash('sha256').update(body).digest('hex');
          const expected=fs.readFileSync('dist/release.json'),expectedHash=sha(expected);
          let matched=false,lastError='';
          for(let i=0;i<60;i++){
            try{
              const url=process.env.APP_URL+'release.json?sha='+process.env.CANDIDATE_SHA;
              const r=await fetch(url,{cache:'no-store'}),body=Buffer.from(await r.arrayBuffer()),m=JSON.parse(body.toString('utf8'));
              if(r.ok&&m.sourceSHA===process.env.CANDIDATE_SHA&&sha(body)===expectedHash){
                fs.mkdirSync('/tmp/w041-hosted-release',{recursive:true});
                fs.writeFileSync('/tmp/w041-hosted-release/release.json',body);
                fs.writeFileSync('/tmp/w041-hosted-release/HTTP.json',JSON.stringify({url,resolvedURL:r.url,status:r.status,sourceSHA:m.sourceSHA,publisherSHA:m.workflowSHA,storageKey:m.storageKey,expectedHash,actualHash:sha(body),fullContractMatched:true},null,2));
                matched=true;break;
              }
              lastError='source or complete release contract mismatch';
            }catch(e){lastError=String(e)}
            await new Promise(r=>setTimeout(r,2000));
          }
          if(!matched)throw Error('PUBLIC_FULL_CONTRACT_MISMATCH '+lastError);
          NODE
          EVIDENCE_DIR=/tmp/w041-hosted node work/items/W-MATH-041-n08-inline-derivation-alignment/verify_app.mjs
          EVIDENCE_DIR=/tmp/w041-hosted-r6 node work/items/W-MATH-041-n08-inline-derivation-alignment/verify_revision6.mjs
          EVIDENCE_DIR=/tmp/w041-hosted-legacy node work/items/W-MATH-040-n08-construction-layout/verify_legacy.mjs
          # W035 targets the retired N09/N10 renderer. Current and archived routes are checked by the W046 verifier above.
      - name: Await original N11 figure decoding in verification only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('work/items/W-MATH-038-transformation-groups/verify_app.mjs')
          old='im=>im.complete&&im.naturalWidth>0'
          new="async im=>{await Promise.race([im.decode(),new Promise((_,reject)=>setTimeout(()=>reject(Error('FIGURE_DECODE_TIMEOUT')),30000))]);return im.complete&&im.naturalWidth>0}"
          s=p.read_text()
          if old in s:
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          else:
              assert new in s
          PY
      - name: Verify retained public N11
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: EVIDENCE_DIR=/tmp/w047-hosted node publisher/tools/release/w051-p005-publish-check.mjs retained-047
      - name: Verify published W048 exact bytes and N13/N14 operations
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: /tmp/w048-hosted
        run: node publisher/tools/release/w051-p005-publish-check.mjs retained-048
      - name: Verify published final bytes and retained N04 focused operations
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: /tmp/w050-hosted
        run: node publisher/tools/release/w051-p005-publish-check.mjs verify-focused
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w046-publication-evidence
          path: |
            dist/release.json
            dist/w046-release.json
            dist/w047-release.json
            dist/w048-release.json
            dist/w050-release.json
            /tmp/w046-prepublish
            /tmp/w046-prepublish-n08
            /tmp/w046-prepublish-r6
            /tmp/w046-prepublish-legacy
            /tmp/w047-prepublish
            /tmp/w046-hosted
            /tmp/w046-preview.log
            /tmp/w041-hosted
            /tmp/w041-hosted-r6
            /tmp/w041-hosted-release
            /tmp/w041-hosted-legacy
            /tmp/w041-hosted-protected
            /tmp/w047-hosted
            /tmp/w048-prepublish
            /tmp/w048-hosted
            /tmp/w050-prepublish
            /tmp/w050-hosted
            /tmp/w051-sourceqa-build/REUSE.json
            /tmp/w051-sourceqa-build/RUN_API.json
            /tmp/w051-sourceqa-build/*_API.json
            /tmp/w050-rollout-publisher-adapters/**/PROVENANCE.json
            /tmp/w050-rollout-retained-cb/**/RETAINED_CB_SOURCE_RESULT.json
            /tmp/w050-rollout-retained-cb/**/ORIGINAL_W050_CB_BYTES.log
            /tmp/w050-p003-regression-evidence/P003_TEST.log
            /tmp/w050-p003-regression-evidence/P003_TEST_PROVENANCE.json
            /tmp/w050-p004-regression-evidence/P004_TEST.log
            /tmp/w050-p004-regression-evidence/P004_TEST_PROVENANCE.json
            /tmp/w050-apt-mirrors-*.before
  publish:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE_SHA: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
      VITE_PREVIEW_COMMIT: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
      W051_SOURCE_QA_DIRECTORY: /tmp/w051-sourceqa-build
      W051_HISTORICAL_T_ROOT: ${{ github.workspace }}/historical-t
      W051_ORIGINAL_PUBLISHER_ROOT: ${{ github.workspace }}/historical-publisher
      W050_BASELINE_CHECKOUT: ${{ github.workspace }}/baseline-cb
      W050_SERVICE_ROOT: ${{ github.workspace }}/service-u
      W050_SERVICE_V_ROOT: ${{ github.workspace }}/service-v
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ac9f31ec205424f393a488f0d17cb3bb8bc75fd
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout publisher checks from reviewed publisher revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          sparse-checkout: |
            tools/release/w046-publish-check.mjs
            tools/release/w047-publish-check.mjs
            tools/release/w047-release-contract.json
            tools/release/w048-publish-check.mjs
            tools/release/w048-release-contract.json
            tools/release/w050-publish-check.mjs
            tools/release/w050-release-contract.json
            tools/release/w050-rollout-publish-check.mjs
            tools/release/w050-rollout-release-contract.json
            tools/release/w050-figure-readiness-original.py
            tools/release/w050-rollout-browser.mjs
            tools/release/w051-p005-publish-check.mjs
            tools/release/w051-p005-release-contract.json
            tools/release/w051-p005-native-proof.mjs
            tools/release/w051-p005-sourceqa.py
            tools/release/w051-p005-dist.mjs
            tools/release/w051-p005-hosted.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout immutable native service U two-file overlay only
        uses: actions/checkout@v4
        with:
          ref: 2d4de64a6da7aff1a36fa057c5e73d02c73c0d9b
          path: service-u
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            tools/textbook/operations.mjs
            tools/textbook/tests/operations-warning-resolutions.test.mjs
          sparse-checkout-cone-mode: false
      - name: Checkout immutable native service V full implementation closure
        uses: actions/checkout@v4
        with:
          ref: a4dad490daa3d1bf8f7011f2915342c543e8a79c
          path: service-v
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original CB for unchanged legacy guard execution
        uses: actions/checkout@v4
        with:
          ref: cb01da34c99005fde4a64fd932b31edeaa3790b3
          path: baseline-cb
          persist-credentials: false
      - name: Checkout original T for unchanged historical guards
        uses: actions/checkout@v4
        with:
          ref: 751b229cb7a99a6a5743b00c5b978c97585b4964
          path: historical-t
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout original a425 tooling without modification
        uses: actions/checkout@v4
        with:
