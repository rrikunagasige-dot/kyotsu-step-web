name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE_SHA: e7320590d4af51b7cc0d9faa918485467092a3c0
      VITE_PREVIEW_COMMIT: e7320590d4af51b7cc0d9faa918485467092a3c0
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7320590d4af51b7cc0d9faa918485467092a3c0
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The exact candidate completed the comprehensive W040 CI before this publication.
      - name: Existing Word source adapter dependency
        run: |
          timeout 120s sudo apt-get update -qq
          timeout 180s sudo apt-get install -y pandoc fonts-noto-cjk
      - run: python -m pip install -r tools/textbook/research/requirements-solution.txt
      - run: node work/items/W-MATH-040-n08-construction-layout/release_manifest.mjs --check
      - run: pnpm run build
      - run: node work/items/W-MATH-003-numbers-expressions-creation/NE01_NE02/export-runtime.mjs
      - run: node work/items/W-MATH-040-n08-construction-layout/release_manifest.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - name: Verify exact release before upload
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('dist/release.json')),p=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/n08ConstructionPresentation.json'));
          if(m.sourceSHA!==process.env.CANDIDATE_SHA||m.work!=='W-MATH-040'||m.activeN08Revision!==6||m.construction.requiredParents!==33||m.construction.independentParts!==15||m.construction.planHash!==p.planHash||m.construction.layoutDesignHash!==p.layoutDesignHash||m.storageKey!==process.env.VITE_STORAGE_NAMESPACE||m.oldN08.revision!==4||m.originalN08.revision!==5||m.retainedN11!==JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/n11Transformation.json')).planHash)throw Error('RELEASE_CONTRACT_MISMATCH');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish approved N08 r6 with retained r5 and r4
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public source and N08 operations
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          let matched=false;
          for(let i=0;i<60;i++){
            try{const r=await fetch(process.env.APP_URL+'release.json?sha='+process.env.CANDIDATE_SHA,{cache:'no-store'});const m=await r.json();if(m.sourceSHA===process.env.CANDIDATE_SHA&&m.activeN08Revision===6&&m.storageKey===process.env.VITE_STORAGE_NAMESPACE){matched=true;break}}catch{}
            await new Promise(r=>setTimeout(r,2000));
          }
          if(!matched)throw Error('PUBLIC_SOURCE_MISMATCH');
          NODE
          EVIDENCE_DIR=/tmp/w040-hosted node work/items/W-MATH-040-n08-construction-layout/verify_app.mjs
          EVIDENCE_DIR=/tmp/w040-hosted-legacy node work/items/W-MATH-040-n08-construction-layout/verify_legacy.mjs
          EVIDENCE_DIR=/tmp/w040-hosted-protected node work/items/W-MATH-035-choice-order-factor-audit/verify_display.mjs
      - name: Await original N11 figure decoding in verification only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('work/items/W-MATH-038-transformation-groups/verify_app.mjs')
          old='im=>im.complete&&im.naturalWidth>0'
          new="async im=>{await Promise.race([im.decode(),new Promise((_,reject)=>setTimeout(()=>reject(Error('FIGURE_DECODE_TIMEOUT')),30000))]);return im.complete&&im.naturalWidth>0}"
          s=p.read_text()
          if old in s:
              assert s.count(old)==1
              p.write_text(s.replace(old,new))
          else:
              assert new in s
          PY
      - name: Verify retained public N11
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: EVIDENCE_DIR=/tmp/w040-hosted-n11 node work/items/W-MATH-038-transformation-groups/verify_app.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w040-publication-evidence
          path: |
            /tmp/w040-hosted
            /tmp/w040-hosted-legacy
            /tmp/w040-hosted-protected
            /tmp/w040-hosted-n11
