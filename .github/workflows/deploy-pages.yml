name: Publish approved N07 to existing app
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE_SHA: '4fb7a98e7f864839ccc1374080473df4ba60ce88'
      VITE_PREVIEW_COMMIT: '4fb7a98e7f864839ccc1374080473df4ba60ce88'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/kyotsu-step-web/'
      VITE_STORAGE_NAMESPACE: 'kyotsu-step-gate3-math-20261023'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '4fb7a98e7f864839ccc1374080473df4ba60ce88'
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact source, approval and protected scope
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node tools/textbook/integrate-n07.mjs --check
          node work/items/W-GOV-010-learning-production-workflow/n07/integration/verify-scope.mjs
      - name: Learner regressions (confirmed pre-existing physics catalog failures excluded)
        run: pnpm exec vitest run --exclude src/data/physicsTaxonomy.test.ts --exclude src/domain/questionSchema.test.ts
      - run: pnpm run test:textbook-authoring
      - run: node work/items/W-MATH-003-numbers-expressions-creation/NE01_NE02/export-runtime.mjs
      - run: pnpm run build
      - name: Exact-source release manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const runtime=JSON.parse(fs.readFileSync('e2e-evidence/chapter-runtime/runtime-units.json','utf8'))
          if(runtime.metadata.sourceSHA!==process.env.CANDIDATE_SHA||runtime.units.length!==16)throw Error('source mismatch')
          const n07=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/n07Authored.json','utf8'))
          const manifest={sourceSHA:process.env.CANDIDATE_SHA,workflowSHA:process.env.GITHUB_SHA,storageKey:process.env.VITE_STORAGE_NAMESPACE,acceptedFirstTitle:'22bc43ba53fa87bb85e82e18a25db13a5c8a485c',contentApproval:n07.contentApproval,repairedUnit:n07.unit.unitId,themes:3,units:runtime.units.map(x=>({id:x.unit.unitId,revision:x.unit.revision,items:x.unit.sections.flatMap(s=>s.items.map(q=>q.id))}))}
          fs.writeFileSync('dist/release.json',JSON.stringify(manifest,null,2))
          NODE
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compiled N07 and accepted first-title browser checks
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/n07-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/kyotsu-step-web/ >/dev/null && break || sleep 1; done
          EVIDENCE_DIR=/tmp/n07-browser node work/items/W-GOV-010-learning-production-workflow/n07/integration/verify-app.mjs
          EVIDENCE_DIR=/tmp/first-title-compiled node work/items/W-MATH-031-section-one-typesetting/verify-typography.mjs
          EVIDENCE_DIR=/tmp/first-title-history node work/items/W-MATH-031-section-one-typesetting/verify-history.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish approved N07 with the existing storage namespace
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted exact source
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          let matched=false
          for(let attempt=0;attempt<60;attempt++){
            try{const r=await fetch(process.env.APP_URL+'release.json?sha='+process.env.CANDIDATE_SHA,{cache:'no-store'});const m=await r.json();if(m.sourceSHA===process.env.CANDIDATE_SHA&&m.storageKey===process.env.VITE_STORAGE_NAMESPACE){matched=true;console.log(JSON.stringify(m));break}}catch{}
            await new Promise(r=>setTimeout(r,2000))
          }
          if(!matched)throw Error('Hosted source did not match')
          NODE
      - name: Play actual public N07 at320/390/1440px
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: /tmp/n07-hosted
        run: node work/items/W-GOV-010-learning-production-workflow/n07/integration/verify-app.mjs
      - name: Protect public accepted first-title typography
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: /tmp/first-title-hosted
        run: node work/items/W-MATH-031-section-one-typesetting/verify-typography.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n07-publication-verification
          path: |
            /tmp/n07-browser
            /tmp/n07-hosted
            /tmp/first-title-compiled
            /tmp/first-title-history
            /tmp/first-title-hosted
            dist/release.json
          if-no-files-found: warn
          retention-days: 30
