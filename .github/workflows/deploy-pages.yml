name: Publish approved first-section typesetting one unit at a time

# 2026-10-24: user explicitly authorized one-theme repair -> compile -> public app -> hands-on review.
# This updates only the hosting pointer; it does not merge the learner branch into main.
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ONLY_UNIT: 'n04'
      CANDIDATE_SHA: '2a2191990b33a440cdbaae05b3645841f2cc2f62'
      VITE_PREVIEW_COMMIT: '2a2191990b33a440cdbaae05b3645841f2cc2f62'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/kyotsu-step-web/'
      VITE_STORAGE_NAMESPACE: 'kyotsu-step-gate3-math-20261023'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '2a2191990b33a440cdbaae05b3645841f2cc2f62'
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact source and protected scope
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node work/items/W-MATH-027-first-theme-repair/verify-scope.mjs
          node work/items/W-MATH-031-section-one-typesetting/verify-invariants.mjs
      - name: Lesson, history and shared formula regression
        run: pnpm exec vitest run src/data/textbook/math src/domain/textbook.test.ts src/review/reviewTargets.test.ts src/components/textbook/TextbookFormula.test.tsx src/components/textbook/formulaWrap.test.tsx src/components/textbook/firstThemeChoiceLayout.test.ts src/components/textbook/typesetRows.test.ts
      - name: Verify authored generation is reproducible
        run: |
          python work/items/W-MATH-029-section-one-teaching/author-sequence.py
          git diff --exit-code -- src/data/textbook/math/numbers/firstSectionTeaching.json work/items/W-MATH-030-section-one-results-and-blanks/IMPLEMENTATION_LEDGER.json
      - name: Protected math practice and physics/domain data
        run: pnpm exec vitest run src/data/textbookUnits.test.ts src/data/textbookFigureAssets.test.ts src/data/textbookPracticeQuestions.test.ts src/domain/textbookSchema.test.ts src/domain/textbookMath.test.ts src/domain/textbookFormula.test.ts src/components/textbook/TextbookFigure.test.tsx src/data/mathPractice
      - name: Export exact runtime source
        run: node work/items/W-MATH-003-numbers-expressions-creation/NE01_NE02/export-runtime.mjs
      - name: Independent calculation and distractor verification
        run: |
          node work/items/W-MATH-027-first-theme-repair/verify-math.mjs
          node work/items/W-MATH-029-section-one-teaching/verify-current-math.mjs
          node work/items/W-MATH-031-section-one-typesetting/verify-token-preservation.mjs
      - run: pnpm run build
      - name: Attach exact-source release manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const runtime=JSON.parse(fs.readFileSync('e2e-evidence/chapter-runtime/runtime-units.json','utf8'))
          if(runtime.metadata.sourceSHA!==process.env.CANDIDATE_SHA||runtime.units.length!==16)throw Error('source mismatch')
          const manifest={sourceSHA:process.env.CANDIDATE_SHA,lessonBaseline:'171c04781f32c1286a0762905891b582714834f9',workflowSHA:process.env.GITHUB_SHA,storageKey:process.env.VITE_STORAGE_NAMESPACE,typesettingUnits:JSON.parse(fs.readFileSync('src/data/textbook/math/typesetting.json','utf8')).enabledUnits,themes:3,repairedTheme:'numbers-polynomials',units:runtime.units.map(x=>({id:x.unit.unitId,revision:x.unit.revision,items:x.unit.sections.flatMap(s=>s.items.map(q=>q.id))}))}
          fs.writeFileSync('dist/release.json',JSON.stringify(manifest,null,2))
          NODE
      - run: pnpm exec playwright install --with-deps chromium
      - name: Play compiled first theme at 320,390,1440px before publication
        env:
          EVIDENCE_DIR: e2e-evidence/theme-one-compiled
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/theme-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node work/items/W-MATH-030-section-one-results-and-blanks/verify-app.mjs
      - name: Check mathematical rows, relation groups and labels at four widths
        env:
          EVIDENCE_DIR: e2e-evidence/typesetting-compiled
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/centering-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node work/items/W-MATH-031-section-one-typesetting/verify-typography.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish the authorized first-theme repair
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public SHA, all16 routes, reload and isolated history
        env:
          LIVE_APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: node work/items/W-MATH-027-first-theme-repair/verify-hosted.mjs
      - name: Play the actual public first theme at all three widths
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: e2e-evidence/theme-one-hosted
        run: node work/items/W-MATH-030-section-one-results-and-blanks/verify-app.mjs
      - name: Check actual public mathematical rows, relation groups and labels
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
          EVIDENCE_DIR: e2e-evidence/typesetting-hosted
        run: node work/items/W-MATH-031-section-one-typesetting/verify-typography.mjs
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: section-one-P005-n04-2a219199-verification
          path: |
            e2e-evidence/theme-one/**
            e2e-evidence/section-one/**
            e2e-evidence/theme-one-compiled/**
            e2e-evidence/theme-one-hosted/**
            e2e-evidence/gate3-hosted/**
            e2e-evidence/typesetting-compiled/**
            e2e-evidence/typesetting-hosted/**
            dist/release.json
          if-no-files-found: warn
          retention-days: 30
