name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Checkout the exact triggering main commit, never an outdated pinned lesson
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm run typecheck
      - name: Chapter 1 audited data and math gate
        run: pnpm exec vitest run src/data/textbookUnits.test.ts src/data/textbookFigureAssets.test.ts src/data/textbookPracticeQuestions.test.ts src/domain/textbook.test.ts src/domain/textbookSchema.test.ts src/domain/textbookMath.test.ts src/domain/textbookFormula.test.ts src/components/textbook/TextbookFigure.test.tsx

      - name: Chapter 1 audited browser smoke
        run: pnpm exec playwright test e2e/chapter1-learning-smoke.spec.ts

      - name: Math textbook and practice regression
        run: pnpm exec vitest run src/data/textbook/math src/data/mathPractice src/domain/textbook.test.ts src/domain/textbookSchema.test.ts
      - name: Math textbook + math practice smoke
        run: pnpm exec playwright test e2e/math-textbook-set-smoke.spec.ts e2e/math-practice-pilot.spec.ts --project=desktop-chromium
      - name: Build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
