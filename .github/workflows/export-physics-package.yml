name: Temporary source export

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload complete tracked source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: physics-github-source-20261003
          path: |
            .
            !.git/**
            !.github/workflows/export-physics-package.yml
          include-hidden-files: true
          retention-days: 1
