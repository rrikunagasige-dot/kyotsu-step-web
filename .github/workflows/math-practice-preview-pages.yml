name: Deploy math practice preview

on:
  push:
    branches:
      - 'chatgpt/math-practice-87-120-integration'
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/math-practice-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          path: preview

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production root
        working-directory: production
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build pilot preview
        working-directory: preview
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build --base=/kyotsu-step-web/math-practice-preview/

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/math-practice-preview
          cp -a production/dist/. site/
          cp -a preview/dist/. site/math-practice-preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
