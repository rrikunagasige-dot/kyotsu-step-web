name: Math textbook mode CI

on:
  pull_request:
    paths:
      - 'src/domain/textbook.ts'
      - 'src/domain/textbook.test.ts'
      - 'src/domain/textbookSchema.ts'
      - 'src/domain/textbookSchema.test.ts'
      - 'src/data/textbook/math/**'
      - 'public/assets/math/textbook/**'
      - 'src/data/textbook/index.ts'
      - 'src/repositories/textbookRepository.ts'
      - 'src/pages/TextbookUnitPage.tsx'
      - 'src/pages/LearningSetupPage.tsx'
      - 'src/components/textbook/**'
      - 'src/components/layout/AppShell.tsx'
      - 'src/styles/global.css'
      - 'e2e/math-textbook-set-smoke.spec.ts'
      - 'e2e/numbers-next-batch.spec.ts'
      - 'e2e/n12-derivation.spec.ts'
      - 'e2e/numbers-catalog-publish.spec.ts'
      - '.github/workflows/math-textbook-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-textbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm run typecheck

      - name: Textbook schema and math-unit tests
        run: pnpm exec vitest run src/domain/textbook.test.ts src/domain/textbookSchema.test.ts src/data/textbook/math/mathCatalog.test.ts src/data/textbook/math/mathFrontmatterLeak.test.ts src/data/textbook/math/mathReviewIntegrity.test.ts src/data/textbook/math/mathFigureAssets.test.ts src/data/textbook/math/set/setLesson.test.ts src/data/textbook/math/numbers/n01Lesson.test.ts src/data/textbook/math/numbers/numbersPilots.test.ts src/data/textbook/math/numbers/numbersNextBatch.test.ts src/data/textbook/math/numbers/n09Atomicity.test.ts src/data/textbook/math/numbers/n12DerivationIntegrity.test.ts src/data/textbook/math/proposition/propositionReadingLesson.test.ts src/data/textbook/math/proposition/quantifierLesson.test.ts src/data/textbook/math/function/functionConditionsLesson.test.ts src/data/textbook/math/proposition/propositionProofLesson.test.ts

      - name: Build
        run: pnpm run build

      - name: P-004 production build SVG decode smoke (mobile and desktop)
        env:
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/math-textbook-set-smoke.spec.ts --grep P-004 --project=mobile-chromium --project=desktop-chromium

      - name: N12 26-step in-equation derivation, wrong feedback, figure gate and restore (mobile and desktop)
        run: pnpm exec playwright test e2e/n12-derivation.spec.ts --project=mobile-chromium --project=desktop-chromium

      - name: Math textbook mobile smoke
        run: pnpm exec playwright test e2e/math-textbook-set-smoke.spec.ts --project=mobile-chromium

      - name: Math textbook desktop smoke
        run: pnpm exec playwright test e2e/math-textbook-set-smoke.spec.ts --project=desktop-chromium

      - name: N02/N09 original 26 plus four new Q08 holes and original image gate (mobile and desktop)
        run: pnpm exec playwright test e2e/numbers-next-batch.spec.ts --project=mobile-chromium --project=desktop-chromium

      - name: Chapter-1 math catalog, route and review visibility (mobile and desktop)
        run: pnpm exec playwright test e2e/numbers-catalog-publish.spec.ts --project=mobile-chromium --project=desktop-chromium

      - name: Physics textbook regression
        run: pnpm exec playwright test e2e/chapter1-learning-smoke.spec.ts --project=desktop-chromium

      - name: Math practice setup regression
        run: pnpm exec playwright test e2e/math-practice-pilot.spec.ts --project=desktop-chromium
