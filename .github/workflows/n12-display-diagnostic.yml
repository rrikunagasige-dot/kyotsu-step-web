name: N12 display diagnosis only
on:
  pull_request:
    paths:
      - '.github/workflows/n12-display-diagnostic.yml'
      - 'e2e/n12-display-diagnostic.spec.ts'
permissions:
  contents: read
jobs:
  diagnostic:
    if: ${{ github.head_ref == 'work/W-MATH-025-n12-display-diagnosis-20261023' }}
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
      E2E_USE_PREVIEW: '1'
      E2E_N12_DIAG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run build
      - name: Japanese font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/n12-display-diagnostic.spec.ts --project=mobile-chromium --project=desktop-chromium
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: n12-display-diagnosis-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/n12-diag-*
          if-no-files-found: error
          retention-days: 7
