name: P015 approved N12 layout verification
on:
  pull_request:
    paths:
      - '.github/workflows/n12-layout-gate.yml'
      - 'e2e/wmath025-p015-n12-layout.spec.ts'
permissions:
  contents: read
jobs:
  diagnostic:
    if: ${{ github.head_ref == 'work/W-MATH-025-p015-n12-layout-approved-20261023' }}
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
      E2E_USE_PREVIEW: '1'
      E2E_P015_LAYOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run build
      - run: pnpm exec vitest run src/components/textbook/TextbookFormula.test.tsx src/review/reviewTargets.test.ts
      - run: pnpm exec eslint src/components/textbook/TextbookFormula.tsx src/components/textbook/TextbookFormula.test.tsx src/pages/TextbookUnitPage.tsx src/review/reviewTargets.ts src/review/reviewTargets.test.ts e2e/wmath025-p015-n12-layout.spec.ts --max-warnings=0
      - name: Japanese font
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/wmath025-p015-n12-layout.spec.ts --project=mobile-chromium --project=desktop-chromium
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: p015-n12-layout-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/p015-*
          if-no-files-found: error
          retention-days: 7
