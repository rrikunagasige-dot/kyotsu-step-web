name: Production workflow C/R integration P004
on:
  push:
    branches: ['work/production-workflow-p003-20261024', 'work/workflow-cr-integration-p004-20261024', 'work/n07-semantic-repair-proposal-20261025', 'work/n08-absolute-value-design-20261025', 'work/n09-n10-guided-design-20261025']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: python -m pip install lxml==6.1.1 numpy==2.3.5 scikit-learn==1.8.0
      - run: sudo apt-get update -qq && sudo apt-get install -y pandoc
      - run: pnpm run test:production-workflow
      - run: node --test tools/textbook/tests/n07-repair.test.mjs
      - run: python workflow/verify_integration.py --root . --out /tmp/p004-integration
      - run: python -m unittest discover -s work/items/W-GOV-010-coded-authoring/engine -p 'test_*.py' -q
      - run: pnpm run test:textbook-authoring
      - name: Learner regressions (documented baseline failures excluded)
        run: pnpm exec vitest run --exclude src/data/physicsTaxonomy.test.ts --exclude src/domain/questionSchema.test.ts
      - run: pnpm exec eslint src/components/textbook/SemanticReading.tsx src/components/textbook/SemanticReading.test.tsx src/domain/textbookSchema.ts --max-warnings=0
      - run: node tools/textbook/integrate-n07.mjs --check
      - name: N08 approved materialization, migration and reader checks
        if: contains(github.ref, 'n08-absolute-value')
        run: pnpm exec vitest run --config work/items/W-MATH-033-n08-absolute-value/vitest.config.mjs
      - name: N09 frozen materialization and saved-data reader checks
        if: contains(github.ref, 'n09-n10-guided')
        run: pnpm exec vitest run --config work/items/W-MATH-034-n09-n10-guided-design/vitest.config.mjs
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Protected learner UI at four widths
        env:
          WIDTHS: 320,390,430,1440
          EVIDENCE_DIR: /tmp/production-browser
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/production-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/kyotsu-step-web/ >/dev/null && break || sleep 1; done
          node work/items/W-GOV-010-learning-production-workflow/n07/integration/verify-app.mjs
      - name: N07 semantic repair all states at four widths
        if: contains(github.ref, 'n07-semantic-repair')
        env:
          WIDTHS: 320,390,430,1440
          EVIDENCE_DIR: /tmp/n07-semantic-browser
        run: node work/items/W-MATH-032-n07-semantic-repair/verify_app.mjs
      - name: Presentation role diagram tabs and text bounds
        if: contains(github.ref, 'n07-semantic-repair')
        run: node work/items/W-MATH-032-n07-semantic-repair/presentation/verify_presentation.mjs
      - name: N08 full learner flow at four widths
        if: contains(github.ref, 'n08-absolute-value')
        run: node work/items/W-MATH-033-n08-absolute-value/verify_app.mjs
      - name: N09 complete learner flow at four widths
        if: contains(github.ref, 'n09-n10-guided')
        run: node work/items/W-MATH-034-n09-n10-guided-design/verify_app.mjs
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.ref, 'n09-n10-guided')
        with:
          name: n09-learner-evidence
          path: /tmp/n09-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && contains(github.ref, 'n08-absolute-value')
        with:
          name: n08-learner-evidence
          path: /tmp/n08-browser
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-workflow-evidence
          path: |
            /tmp/production-browser
            /tmp/p004-integration
            /tmp/n07-semantic-browser
            /tmp/workflow-role-diagrams
          if-no-files-found: warn
