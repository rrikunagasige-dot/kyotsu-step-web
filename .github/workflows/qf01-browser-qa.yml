# P040 diagnostic; additive focus measurement before original unchanged assertions.
name: QF01 P040 pointer-safe focus correction browser prototype (no deploy)
'on':
  push:
    branches:
    - work/qf01-p040-pointer-safe-browser-20261115
    paths:
    - .github/workflows/qf01-browser-qa.yml
permissions:
  contents: read
concurrency:
  group: qf01-p040-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_ROOT: ${{ github.workspace }}/material
  PRODUCER_ROOT: ${{ github.workspace }}/producer
  SOURCE_SHA: ${{ github.event.before }}
  VITE_PREVIEW_COMMIT: ${{ github.event.before }}
  VITE_BASE_PATH: /kyotsu-step-web/
  VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
  STORAGE_KEY: kyotsu-step-gate3-math-20261023
jobs:
  build:
    if: github.ref == 'refs/heads/work/qf01-p040-pointer-safe-browser-20261115' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.before }}
        path: material
        fetch-depth: 2
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: producer
        fetch-depth: 2
        persist-credentials: false
    - name: Decode frozen diagnostic files from producer workflow
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'BOOTSTRAP'
        import os,json,base64,hashlib,pathlib,subprocess
        p=pathlib.Path(os.environ['PRODUCER_ROOT'])/'.github/workflows/qf01-browser-qa.yml'
        s=p.read_text();start=s.index('# P040_PAYLOAD_BEGIN\n')+len('# P040_PAYLOAD_BEGIN\n');end=s.index('# P040_PAYLOAD_END',start)
        lines=s[start:end].splitlines();assert all(line.startswith('# ')for line in lines)
        v=json.loads(''.join(line[2:]for line in lines));assert set(v)=={'assertions.mjs','ci-runner.mjs','binding.json','navigation-audit.mjs'}
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'qf01-p040';assert not out.exists();out.mkdir()
        for name,item in v.items():
         b=base64.b64decode(item['base64'],validate=True);assert hashlib.sha256(b).hexdigest()==item['sha256'];(out/name).write_bytes(b)
        BOOTSTRAP
    - uses: pnpm/action-setup@v4
      with:
        version: 11.9.0
        run_install: false
        package_json_file: material/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile
      working-directory: material
    - run: pnpm run typecheck && pnpm exec vitest run src/data/textbook/math/quadratic/qf01Lesson.test.tsx && pnpm run build
      working-directory: material
    - name: Bind one immutable diagnostic build
      shell: bash
      run: |-
        set -euo pipefail
        node "$RUNNER_TEMP/qf01-p040/ci-runner.mjs" prepare --source-root "$SOURCE_ROOT" --producer-root "$PRODUCER_ROOT" --bundle "$RUNNER_TEMP/qf01-dist-bundle"
    - uses: actions/upload-artifact@v4
      with:
        name: p040-dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qf01-dist-bundle/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  capture:
    if: github.ref == 'refs/heads/work/qf01-p040-pointer-safe-browser-20261115' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        width:
        - 320
        - 390
        - 430
        - 1440
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.before }}
        path: material
        fetch-depth: 2
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: producer
        fetch-depth: 2
        persist-credentials: false
    - name: Decode frozen diagnostic files from producer workflow
      shell: bash
      run: |-
        set -euo pipefail
        python3 - <<'BOOTSTRAP'
        import os,json,base64,hashlib,pathlib,subprocess
        p=pathlib.Path(os.environ['PRODUCER_ROOT'])/'.github/workflows/qf01-browser-qa.yml'
        s=p.read_text();start=s.index('# P040_PAYLOAD_BEGIN\n')+len('# P040_PAYLOAD_BEGIN\n');end=s.index('# P040_PAYLOAD_END',start)
        lines=s[start:end].splitlines();assert all(line.startswith('# ')for line in lines)
        v=json.loads(''.join(line[2:]for line in lines));assert set(v)=={'assertions.mjs','ci-runner.mjs','binding.json','navigation-audit.mjs'}
        out=pathlib.Path(os.environ['RUNNER_TEMP'])/'qf01-p040';assert not out.exists();out.mkdir()
        for name,item in v.items():
         b=base64.b64decode(item['base64'],validate=True);assert hashlib.sha256(b).hexdigest()==item['sha256'];(out/name).write_bytes(b)
        BOOTSTRAP
    - uses: pnpm/action-setup@v4
      with:
        version: 11.9.0
        run_install: false
        package_json_file: material/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: pnpm install --frozen-lockfile
      working-directory: material
    - uses: actions/download-artifact@v4
      with:
        name: p040-dist-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qf01-dist-bundle/
    - run: pnpm exec playwright install --with-deps chromium
      working-directory: material
    - name: Capture unchanged current assertions on ordinary local route
      shell: bash
      run: |-
        set -euo pipefail
        node "$RUNNER_TEMP/qf01-p040/ci-runner.mjs" capture --source-root "$SOURCE_ROOT" --producer-root "$PRODUCER_ROOT" --bundle "$RUNNER_TEMP/qf01-dist-bundle" --width "${{ matrix.width }}" --out "$RUNNER_TEMP/qf01-capture-${{ matrix.width }}"
    - name: Preserve actual partial failures and raw current evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: p040-capture-${{ matrix.width }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qf01-capture-${{ matrix.width }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

