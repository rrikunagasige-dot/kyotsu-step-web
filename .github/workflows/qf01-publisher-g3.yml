                raw = Path(row[key]).read_bytes()
                rows.append({'path': row[key], 'sha256': hashlib.sha256(raw).hexdigest(),
                             'unchanged': len(raw) == row['bytes'] and hashlib.sha256(raw).hexdigest() == row['sha256']})
        core_root = Path(os.environ['GITHUB_WORKSPACE']) / 'core'
        for name, expected in binding['currentRepairSource'].items():
            actual = hashlib.sha256((core_root / name).read_bytes()).hexdigest()
            rows.append({'path': str(core_root / name), 'sha256': actual, 'unchanged': actual == expected})
        assert current_core_identity() == binding['core'], 'Current core source changed during diagnostics'
        import subprocess
        harness_root=Path(os.environ['GITHUB_WORKSPACE'])/'checkpoint-test-harness'
        for directory,expected in [(core_root,binding['checkouts']['core']),(harness_root,binding['checkouts']['checkpoint-test-harness'])]:
            assert subprocess.check_output(['git','-C',str(directory),'rev-parse','HEAD'],text=True).strip()==expected
            assert subprocess.check_output(['git','-C',str(directory),'diff','--name-only','HEAD'],text=True).strip()==''
        for name,wanted in binding['core']['files'].items():
            assert hashlib.sha256((core_root/'workflow'/name).read_bytes()).hexdigest()==wanted
        for name,wanted in binding['testHarness']['historicalWorkflowFiles'].items():
            assert hashlib.sha256((harness_root/'workflow'/name).read_bytes()).hexdigest()==wanted
        (out / 'INPUT_IMMUTABILITY.json').write_text(json.dumps(rows, indent=2) + '\n', encoding='utf-8')
        assert all(row['unchanged'] for row in rows), 'An original input or its test copy changed'
        PY
    - name: Record executed diagnostics without issuing native results
      if: always()
      env:
        PIN_OUTCOME: ${{ steps.pins.outcome }}
        INPUT_OUTCOME: ${{ steps.inputs.outcome }}
        DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
        CHECKPOINT_OUTCOME: ${{ steps.checkpoint_tests.outcome }}
        TEST_HARNESS_OUTCOME: ${{ steps.test_harness.outcome }}
        PUBLISHER_OUTCOME: ${{ steps.publisher_tests.outcome }}
        NORMAL_OUTCOME: ${{ steps.normal_workflow.outcome }}
        PRODUCTION_OUTCOME: ${{ steps.production_services.outcome }}
        APP_OUTCOME: ${{ steps.app_tests.outcome }}
        AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
        LINT_OUTCOME: ${{ steps.scoped_lint.outcome }}
        BUILD_OUTCOME: ${{ steps.lint_build.outcome }}
        IMMUTABILITY_OUTCOME: ${{ steps.input_immutability.outcome }}
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, os
        from pathlib import Path
        out = Path(os.environ['CHECKPOINT_DIAGNOSTICS'])
        out.mkdir(parents=True, exist_ok=True)
        report = {'schemaVersion': 'qf01-checkpoint-linux-diagnostics/1',
                  'publisherSHA': os.environ['GITHUB_SHA'],
                  'stepOutcomes': {key: value for key, value in os.environ.items() if key.endswith('_OUTCOME')},
                  'testFixturesOnly': True, 'nativeBootstrapPerformed': False,
                  'newNativeLedgerReadOrExported': False, 'formalReceiptGenerated': False,
                  'gateAccepted': False, 'publicationPerformed': False}
        (out / 'DIAGNOSTICS.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qf01-checkpoint-linux-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ env.CHECKPOINT_DIAGNOSTICS }}
        if-no-files-found: error
        compression-level: 6
