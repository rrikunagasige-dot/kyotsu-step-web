# DRAFT ONLY: final request/authority hash review required; never merge this helper.
name: QF01 P016 one-shot no-login dispatch transport
'on':
  push:
    branches: ['work/qf01-dispatch-p016-b2ad612-20261113']
    paths: ['.github/workflows/qf01-publisher-g3.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: qf01-one-shot-p016-b2ad612-20261113
  cancel-in-progress: false
jobs:
  dispatch-existing-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: work/items/W-TECH-QF01-PUBLISHER-P016-20261113/ONE_SHOT_P016_DEPLOY_REQUEST.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate actual native authority and dispatch exact unchanged main once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          # DRAFT ONLY. Final request hash and actual authority must be frozen/reviewed before push.
          import os,json,hashlib,base64,re,urllib.request,subprocess
          from pathlib import Path
          REPO='rrikunagasige-dot/kyotsu-step-web'
          REPO_ID=1391122224
          OWNER_ID=332552275
          MAIN='b2ad6121194707f033068287437aece2a90763f9'
          SOURCE='384021f539967038a20fd98bd146e0e499f0df65'
          PRODUCER=43397946853
          ATTEMPT=1
          PRODUCER_BRANCH='work/qf01-p013-publisher-20261112'
          BRANCH='work/qf01-dispatch-p016-b2ad612-20261113'
          WORKFLOW='.github/workflows/qf01-publisher-g3.yml'
          WORKFLOW_ID=414041827
          WORKFLOW_SHA='8f5c18a13780f298618280cf0218cee41e0a9804790f90a01076f447f7d331dd'
          REQUEST='work/items/W-TECH-QF01-PUBLISHER-P016-20261113/ONE_SHOT_P016_DEPLOY_REQUEST.json'
          REQUEST_SHA='75d5a5f061d1bc99fc550dd801eef7109ac5db4fca64fbcf1928e9806fa697aa'
          PROPOSAL_SHA='ca02272fe00f469893027153f13d2b4a7690b2d8885016f1dae74ba17ffcba3e'
          PUBLISHER_PINS={'.github/workflows/qf01-publisher-g3.yml': '8f5c18a13780f298618280cf0218cee41e0a9804790f90a01076f447f7d331dd', 'tools/release/qf01-browser.mjs': '25c01283e7afdd9431d85cb86d53464d8688fb06e2d67cab6c785325a74d6d12', 'tools/release/qf01-publish-check.mjs': 'c10d38ed9c59a3da8eaba4290c3172eed89f0813b555b22635824cd71304fffd', 'tools/release/qf01-publish-check.test.mjs': '89ed404952317d68ff30b639381a39d47b6b991ce36885869d6228e3eccaba84', 'tools/release/qf01-publish-contract.json': '8343c56bf9eb9513d0fccbb6518c0b9d90a8de9aa1c34f12371f43980961f493', 'tools/release/qf01-retained-adapters.mjs': 'ea21d2587e0cd074eda350fc33b4d2e5736974d7f526aaa1da1991049ca15ca6', 'tools/release/qf01-retained-adapters.test.mjs': '537113fac7de4bdad0729266fb5e51b3edcb83e2ae82725d1d0a352415a8d16a'}
          
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def unique_pairs(pairs):
              result={}
              for key,value in pairs:
                  require(key not in result,'duplicate JSON key')
                  result[key]=value
              return result
          def parse(raw):return json.loads(raw,object_pairs_hook=unique_pairs)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  raise RuntimeError('Unexpected API redirect')
          opener=urllib.request.build_opener(NoRedirect)
          
          def api(path,data=None):
              require(path.startswith('/') or path=='','fixed repo-relative API only')
              raw=None if data is None else json.dumps(data,separators=(',',':'),ensure_ascii=False).encode()
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=raw,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if data is None else 'POST')
              with opener.open(req,timeout=45) as response:
                  body=response.read(9*1024*1024+1);require(len(body)<=9*1024*1024,'bounded API response')
                  return response.status,parse(body) if body else None
          
          def content(path,expected):
              _,item=api('/contents/'+path+'?ref='+MAIN)
              require(item['type']=='file' and item['path']==path and item['encoding']=='base64','immutable source file')
              raw=base64.b64decode(item['content'],validate=False)
              require(len(raw)<=1024*1024,'bounded immutable source')
              require(sha(raw)==expected,'exact immutable publisher bytes '+path)
              require(hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==item['sha'],'Git blob binding '+path)
              return raw
          
          def current_main_and_workflow():
              _,main=api('/git/ref/heads/main');require(main['object']['sha']==MAIN,'live main must remain exact successful producer')
              content(WORKFLOW,WORKFLOW_SHA)
          
          def no_existing_dispatch():
              _,runs=api('/actions/workflows/'+str(WORKFLOW_ID)+'/runs?event=workflow_dispatch&head_sha='+MAIN+'&per_page=100')
              require(runs['total_count']==0 and runs['workflow_runs']==[], 'existing dispatch: reconcile read-only instead of sending')
          
          require(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REPOSITORY_ID']==str(REPO_ID),'repository context')
          require(os.environ['GITHUB_REF']=='refs/heads/'+BRANCH,'isolated operational branch only')
          require(os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_RUN_ATTEMPT']=='1','first push attempt only; no reruns')
          event=parse(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          require(event['repository']['id']==REPO_ID and event['repository']['owner']['id']==OWNER_ID and event['sender']['id']==OWNER_ID,'target sender/owner identity')
          require(event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted'),'push commit binding')
          require(re.fullmatch('[0-9a-f]{64}',REQUEST_SHA),'draft cannot run')
          raw=Path(REQUEST).read_bytes();require(sha(raw)==REQUEST_SHA,'exact frozen request bytes')
          request=parse(raw)
          require(request['schemaVersion']=='qf01-one-shot-p016-dispatch/1' and request['status']=='READY_WITH_ACTUAL_G2_AND_DEPLOY','actual request only')
          require(b'__REQUIRES_' not in raw,'future authority placeholders are forbidden')
          require(request['repository']==REPO and request['repositoryID']==REPO_ID and request['ownerID']==OWNER_ID,'request repo scope')
          require(request['publisherSHA']==MAIN and request['sourceSHA']==SOURCE,'source and publisher separation')
          require(request['producer']=={'runID':PRODUCER,'attempt':ATTEMPT,'headBranch':PRODUCER_BRANCH},'fixed new successful producer')
          require(request['publisherPins']==PUBLISHER_PINS,'exact seven approved immutable files')
          inputs=request['dispatch']['inputs']
          require(request['dispatch']['ref']=='main' and inputs['dry_run']=='false' and inputs['verified_run_id']==str(PRODUCER) and inputs['verified_attempt']==str(ATTEMPT),'fixed same-action dispatch')
          require(set(inputs)=={'dry_run','verified_run_id','verified_attempt','native_intent_chain'},'exact input keys')
          require(len(json.dumps(inputs,ensure_ascii=False).encode())<65535 and len(json.dumps(inputs,ensure_ascii=False))<65535,'no truncated inputs')
          ref=parse(inputs['native_intent_chain'])
          require(ref==request['nativeAuthorityBlobRef'],'identical immutable blob reference')
          require(ref['schemaVersion']=='qf01-native-authority-blob-ref/1' and ref['repository']==REPO and ref['encoding']=='gzip-base64','same-repo native blob only')
          require(set(ref)=={'schemaVersion','repository','blobSHA','blobSHA256','encoding','expandedSHA256'},'exact blob reference schema')
          require(re.fullmatch('[0-9a-f]{40}',ref['blobSHA']) and all(re.fullmatch('[0-9a-f]{64}',ref[k]) for k in ['blobSHA256','expandedSHA256']),'fixed blob hashes')
          expected=request['nativeExpected']
          require(set(expected)=={'operationID','eventHash','sourceSHA','work','releaseUnit','proposalHash','g2Artifact'},'exact native expectation')
          require(expected['work']=='W-MATH-QF01-P011-20261112' and expected['releaseUnit']=='qf01-p011' and expected['sourceSHA']==SOURCE and expected['proposalHash']==PROPOSAL_SHA,'current approved material authority')
          require(isinstance(expected['operationID'],str) and expected['operationID'] and all(re.fullmatch('[0-9a-f]{64}',expected[k]) for k in ['eventHash','proposalHash','g2Artifact']),'actual native operation/evidence hashes')
          _,repo=api('');require(repo['id']==REPO_ID and repo['owner']['id']==OWNER_ID and repo['default_branch']=='main','live target identity')
          _,workflow=api('/actions/workflows/'+str(WORKFLOW_ID));require(workflow['id']==WORKFLOW_ID and workflow['path']==WORKFLOW and workflow['state']=='active','existing workflow identity')
          current_main_and_workflow()
          _,producer=api('/actions/runs/'+str(PRODUCER))
          require(producer['workflow_id']==WORKFLOW_ID and producer['id']==PRODUCER and producer['run_attempt']==ATTEMPT and producer['head_sha']==MAIN and producer['event']=='push' and producer['head_branch']==PRODUCER_BRANCH and producer['path']==WORKFLOW and producer['status']=='completed' and producer['conclusion']=='success','exact completed producer')
          _,jobs=api('/actions/runs/'+str(PRODUCER)+'/attempts/'+str(ATTEMPT)+'/jobs?per_page=100')
          require(jobs['total_count']==8 and len(jobs['jobs'])==8 and len({j['id'] for j in jobs['jobs']})==8,'complete unpaginated eight producer jobs')
          require(all(j['status']=='completed' for j in jobs['jobs']),'producer jobs complete')
          require({j['name'] for j in jobs['jobs'] if j['conclusion']=='success'}=={'build','qa (320)','qa (390)','qa (430)','qa (1440)','attest'},'six verified successful jobs')
          require({j['name'] for j in jobs['jobs'] if j['conclusion']=='skipped'}=={'publish','hosted'},'producer did not publish')
          no_existing_dispatch()
          
          # Fetch only fixed, already approved publisher code. No app build/install/patch.
          snapshot=Path('_immutable_publisher_for_authority')
          require(not snapshot.exists(),'fresh immutable validation snapshot')
          for path,expected_sha in PUBLISHER_PINS.items():
              target=snapshot/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content(path,expected_sha))
          Path('REQUEST_FOR_AUTHORITY_CHECK.json').write_bytes(raw)
          # Same unchanged native checker/hydrator as the target main workflow. Validates seed,
          # definition/implementation, all required objects/events, scoped three intents,
          # source384, exact fresh G2 and pending DEPLOY; no policy/identity fallback.
          node_script="""import fs from 'node:fs';
          import {hydrateNativeAuthority,validateNativeIntent} from './_immutable_publisher_for_authority/tools/release/qf01-publish-check.mjs';
          const request=JSON.parse(fs.readFileSync('REQUEST_FOR_AUTHORITY_CHECK.json'));
          const contract=JSON.parse(fs.readFileSync('_immutable_publisher_for_authority/tools/release/qf01-publish-contract.json'));
          const envelope=await hydrateNativeAuthority(request.nativeAuthorityBlobRef);
          const actual=validateNativeIntent(envelope,contract);
          fs.writeFileSync('NATIVE_AUTHORITY_VALIDATION.json',JSON.stringify(actual,null,2)+String.fromCharCode(10));
          """
          subprocess.run(['node','--input-type=module','-e',node_script],check=True,timeout=120)
          actual=parse(Path('NATIVE_AUTHORITY_VALIDATION.json').read_bytes())
          require(actual==expected,'exact actual G2/DEPLOY authority; never substitute older operation')
          # Recheck immediately before the sole POST. This is not an atomic ref lock;
          # same-publisher target and returned head must both remain exact.
          no_existing_dispatch();current_main_and_workflow()
          receipt_file=Path('DISPATCH_RECEIPT.json')
          base={'operationID':expected['operationID'],'publisherSHA':MAIN,'sourceSHA':SOURCE,'helperSHA':os.environ['GITHUB_SHA'],'helperRun':os.environ['GITHUB_RUN_ID'],'requestSHA256':sha(raw),'nativeAuthorityBlobRef':ref,'nativeEventHash':expected['eventHash'],'g2Artifact':expected['g2Artifact'],'producerRun':PRODUCER,'producerAttempt':ATTEMPT,'noAutomaticRetry':True}
          receipt_file.write_text(json.dumps({**base,'status':'SINGLE_POST_ATTEMPT_STARTING'},indent=2)+chr(10))
          try:
              status,receipt=api('/actions/workflows/'+str(WORKFLOW_ID)+'/dispatches',{**request['dispatch'],'return_run_details':True})
          except Exception as ex:
              receipt_file.write_text(json.dumps({**base,'status':'AMBIGUOUS_RECONCILE_READ_ONLY','errorType':type(ex).__name__},indent=2)+chr(10))
              raise RuntimeError('Dispatch response unknown: read-only reconciliation, no resending') from None
          receipt_file.write_text(json.dumps({**base,'status':'RESPONSE_RECEIVED_NOT_DEPLOYMENT_PROOF','httpStatus':status,'receipt':receipt},indent=2)+chr(10))
          require(status==200 and isinstance(receipt,dict) and type(receipt.get('workflow_run_id')) is int and receipt['workflow_run_id']>0,'ambiguous dispatch: do not retry')
          runid=receipt['workflow_run_id']
          require(receipt['run_url']=='https://api.github.com/repos/'+REPO+'/actions/runs/'+str(runid),'fixed result API URL')
          require(receipt['html_url']=='https://github.com/'+REPO+'/actions/runs/'+str(runid),'fixed result HTML URL')
          _,child=api('/actions/runs/'+str(runid))
          observed={'id':child['id'],'workflow_id':child['workflow_id'],'head_sha':child['head_sha'],'head_branch':child['head_branch'],'event':child['event'],'path':child['path'],'run_attempt':child['run_attempt'],'repositoryID':child['repository']['id']}
          receipt_file.write_text(json.dumps({**base,'status':'ACTUAL_CHILD_OBSERVED_NOT_DEPLOYMENT_PROOF','httpStatus':status,'receipt':receipt,'actualRun':observed,'dispatchActorID':child.get('actor',{}).get('id')},indent=2)+chr(10))
          require(observed=={'id':runid,'workflow_id':WORKFLOW_ID,'head_sha':MAIN,'head_branch':'main','event':'workflow_dispatch','path':WORKFLOW,'run_attempt':1,'repositoryID':REPO_ID},'child binding differs: no retry')
          # Built-in GitHubActions bot actor is expected for GITHUB_TOKEN dispatch (P010 observed
          # actor41898282). It is distinct from the checked human owner/sender, not a new login.
          print(json.dumps({'operationID':expected['operationID'],'dispatchedRunID':runid,'publisherSHA':MAIN,'sourceSHA':SOURCE,'html_url':receipt['html_url']}))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qf01-p016-one-shot-dispatch-receipt-${{ github.run_id }}
          path: |
            DISPATCH_RECEIPT.json
            NATIVE_AUTHORITY_VALIDATION.json
          if-no-files-found: warn
