name: QF01 one-shot no-login caller (P010 transport only)
'on':
  push:
    branches:
    - work/qf01-dispatch-main611-20261111
    paths:
    - .github/workflows/qf01-publisher-g3.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: qf01-one-shot-caller-main611-20261111
  cancel-in-progress: false
jobs:
  dispatch-existing-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: work/items/W-TECH-QF01-PUBLISHER-P010-20261111/ONE_SHOT_DEPLOY_REQUEST.json
        sparse-checkout-cone-mode: false
    - name: Validate exact authority and dispatch unchanged main once
      env:
        GH_TOKEN: ${{ github.token }}
      shell: python
      run: "import os,json,hashlib,base64,urllib.request\nfrom pathlib import Path\nREPO='rrikunagasige-dot/kyotsu-step-web'\n\
        MAIN='611dbdf3425d8b80e8c95636b1295141f773c08a'\nBRANCH='work/qf01-dispatch-main611-20261111'\nWORKFLOW='.github/workflows/qf01-publisher-g3.yml'\n\
        REQUEST='work/items/W-TECH-QF01-PUBLISHER-P010-20261111/ONE_SHOT_DEPLOY_REQUEST.json'\nOP='DEPLOY-QF01-P010-MAIN611-20261111'\n\
        def require(ok,message):\n    if not ok: raise RuntimeError(message)\ndef sha(raw):return hashlib.sha256(raw).hexdigest()\n\
        class NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,req,fp,code,msg,headers,newurl):\n\
        \        raise RuntimeError('Unexpected API redirect')\nopener=urllib.request.build_opener(NoRedirect)\n\
        def api(path,data=None):\n    raw=None if data is None else json.dumps(data,separators=(',',':')).encode()\n\
        \    req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=raw,headers={'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET'\
        \ if data is None else 'POST')\n    with opener.open(req,timeout=45) as response:\n        body=response.read();return\
        \ response.status,json.loads(body) if body else None\nrequire(os.environ['GITHUB_REPOSITORY']==REPO,'repository\
        \ context')\nrequire(os.environ['GITHUB_REF']=='refs/heads/'+BRANCH,'isolated branch only')\nrequire(os.environ['GITHUB_EVENT_NAME']=='push'\
        \ and os.environ['GITHUB_RUN_ATTEMPT']=='1','first push attempt only')\nevent=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())\n\
        require(event['repository']['id']==1391122224 and event['sender']['id']==332552275,'target identity')\n\
        require(event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted'),'push binding')\nraw=Path(REQUEST).read_bytes()\n\
        require(sha(raw)=='37d3fd47a5dadc1dbc888fde22787fcba60a2066b34b32399d56d5c63bc33bf7','exact request bytes')\nrequest=json.loads(raw)\nrequire(request['operationID']==OP\
        \ and request['publisherSHA']==MAIN,'operation binding')\ninputs=request['dispatch']['inputs']\nrequire(request['dispatch']['ref']=='main'\
        \ and inputs['dry_run']=='false' and inputs['verified_run_id']=='42937525528' and inputs['verified_attempt']=='1','fixed\
        \ publisher inputs')\nrequire(set(inputs)=={'dry_run','verified_run_id','verified_attempt','native_intent_chain'},'exact\
        \ input keys')\nrequire(len(inputs['native_intent_chain'].encode())<65535 and len(json.dumps(inputs).encode())<65535,'full\
        \ input limit')\nchain=json.loads(inputs['native_intent_chain']);last=chain[-1]\nrequire(last['kind']=='external_intent'\
        \ and last['work']=='W-MATH-QF01-BUILD-20261109' and last['payload']=={'id':OP,'operation':'DEPLOY','request_hash':'9e033e6cce6bcbe9f0890d396d88e4e981f888e6f04fa349aec4be3c6e7865bf','release_unit':'qf01'},'original\
        \ scoped intent')\n_,repo=api('');require(repo['id']==1391122224 and repo['owner']['id']==332552275 and\
        \ repo['default_branch']=='main','live identity')\n_,main=api('/git/ref/heads/main');require(main['object']['sha']==MAIN,'live\
        \ main unchanged')\n_,workflow=api('/contents/'+WORKFLOW+'?ref='+MAIN)\nrequire(sha(base64.b64decode(workflow['content']))=='5407962eb17bf7baa5fa3686e1db6a77dd1fc30d72c8df943e8723b70cddb3e0','unchanged\
        \ publisher bytes')\n_,run=api('/actions/runs/42937525528')\nrequire(run['workflow_id']==414041827 and run['id']==42937525528\
        \ and run['run_attempt']==1 and run['head_sha']==MAIN and run['event']=='push' and run['head_branch']=='work/qf01-publisher-g3-20261111'\
        \ and run['path']==WORKFLOW and run['status']=='completed' and run['conclusion']=='success','exact successful\
        \ producer')\n_,jobs=api('/actions/runs/42937525528/attempts/1/jobs?per_page=100')\nrequire({j['name'] for\
        \ j in jobs['jobs'] if j['conclusion']=='success'}=={'build','qa (320)','qa (390)','qa (430)','qa (1440)','attest'},'six\
        \ verified jobs')\nrequire({j['name'] for j in jobs['jobs'] if j['conclusion']=='skipped'}=={'publish','hosted'}\
        \ and jobs['total_count']==8,'producer has no publication')\n_,existing=api('/actions/workflows/414041827/runs?event=workflow_dispatch&head_sha='+MAIN+'&per_page=100')\n\
        require(existing['total_count']==0,'reconcile existing dispatch instead of repeating')\n# One POST only.\
        \ A timeout/204/ambiguous response must be reconciled read-only; never retry.\nreceipt_file=Path('DISPATCH_RECEIPT.json')\n\
        base={'operationID':OP,'publisherSHA':MAIN,'helperSHA':os.environ['GITHUB_SHA'],'helperRun':os.environ['GITHUB_RUN_ID'],'requestSHA256':sha(raw),'noAutomaticRetry':True}\n\
        try:\n    status,receipt=api('/actions/workflows/414041827/dispatches',{**request['dispatch'],'return_run_details':True})\n\
        except Exception as ex:\n    receipt_file.write_text(json.dumps({**base,'status':'AMBIGUOUS_RECONCILE_READ_ONLY','errorType':type(ex).__name__},indent=2)+chr(10))\n\
        \    raise RuntimeError('Dispatch response unknown; reconcile actual runs without resending') from None\n\
        receipt_file.write_text(json.dumps({**base,'httpStatus':status,'receipt':receipt},indent=2)+chr(10))\nrequire(status==200\
        \ and isinstance(receipt,dict) and isinstance(receipt.get('workflow_run_id'),int),'ambiguous dispatch; inspect\
        \ actual runs, do not retry')\nrunid=receipt['workflow_run_id']\nrequire(receipt['run_url']=='https://api.github.com/repos/'+REPO+'/actions/runs/'+str(runid),'fixed\
        \ result URL')\nrequire(receipt['html_url']=='https://github.com/'+REPO+'/actions/runs/'+str(runid),'fixed\
        \ HTML result URL')\n_,actual=api('/actions/runs/'+str(runid))\nobserved={'id':actual['id'],'head_sha':actual['head_sha'],'event':actual['event'],'path':actual['path'],'run_attempt':actual['run_attempt'],'repositoryID':actual['repository']['id']}\n\
        receipt_file.write_text(json.dumps({**base,'httpStatus':status,'receipt':receipt,'actualRun':observed},indent=2)+chr(10))\n\
        require(observed=={'id':runid,'head_sha':MAIN,'event':'workflow_dispatch','path':WORKFLOW,'run_attempt':1,'repositoryID':1391122224},'dispatched\
        \ run binding; do not retry')\nprint(json.dumps({'operationID':OP,'dispatchedRunID':runid,'publisherSHA':MAIN,'html_url':receipt['html_url']}))\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qf01-one-shot-dispatch-receipt-${{ github.run_id }}
        path: DISPATCH_RECEIPT.json
        if-no-files-found: warn
