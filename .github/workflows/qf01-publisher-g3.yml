name: QF01 P045 one-shot no-login dispatch transport
'on':
  push:
    branches:
    - work/qf01-p045-one-shot-dispatch-20261116
    paths:
    - .github/workflows/qf01-publisher-g3.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: qf01-p045-one-shot-e9ead8cdce8bf26bdc88
  cancel-in-progress: false
jobs:
  dispatch-existing-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: work/items/W-TECH-QF01-PUBLISHER-P045-20261116/ONE_SHOT_P045_DEPLOY_REQUEST.json
        sparse-checkout-cone-mode: false
    - uses: actions/checkout@v4
      with:
        ref: b8d0154d5b875d028ef401967ef2b9d7a316c291
        path: current-core
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: 9e6d6798ac40624373db0a87e53e7d8938fb317a
        path: material
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Validate actual native authority and dispatch exact unchanged main once
      env:
        GH_TOKEN: ${{ github.token }}
        CORE_ROOT: ${{ github.workspace }}/current-core
        SOURCE_ROOT: ${{ github.workspace }}/material
      shell: python
      run: "# ACTUAL BOUND one-shot authority. Finite final review and fresh Pages/main check required before the only push.\n\
        import os,json,hashlib,base64,re,urllib.request,subprocess\nfrom pathlib import Path\nREPO='rrikunagasige-dot/kyotsu-step-web'\n\
        REPO_ID=1391122224\nOWNER_ID=332552275\nMAIN='494b6b0322f68a2447feb14a1d3acf550793f296'\nSOURCE='9e6d6798ac40624373db0a87e53e7d8938fb317a'\n\
        PRODUCER=43746225754\nATTEMPT=1\nPRODUCER_BRANCH='work/qf01-p045-full-publisher-20261116'\nBRANCH='work/qf01-p045-one-shot-dispatch-20261116'\n\
        WORKFLOW='.github/workflows/qf01-publisher-g3.yml'\nWORKFLOW_ID=414041827\nWORKFLOW_SHA='9d46c8a9a6fd671a657b9f9291ccba616d06bb9233fcd791ae8bb8741d6fa2bb'\n\
        REQUEST='work/items/W-TECH-QF01-PUBLISHER-P045-20261116/ONE_SHOT_P045_DEPLOY_REQUEST.json'\nREQUEST_SHA='5c10e611cba13e67a7384018e41626dbab822ee34ec21019889283197207991e'\n\
        PROPOSAL_SHA='57ec52d9d4e7a182d6b55cfc6dda1bb545dd9ecf6c8ab739496d490b0a03eee8'\nPUBLISHER_PINS={'.github/workflows/qf01-publisher-g3.yml':\
        \ '9d46c8a9a6fd671a657b9f9291ccba616d06bb9233fcd791ae8bb8741d6fa2bb', 'tools/release/qf01-publish-contract.json':\
        \ '4b808d7adc868ab7669f2fead215a4a02d171a3f724b863b2ab0b4ee646dd030', 'tools/release/qf01-publish-check.mjs': 'e4f1b9e55c77286d999da7bfc46c0f1a989525dcd7c94fe8219a2c8e20fe0870',\
        \ 'tools/release/qf01-retained-adapters.mjs': 'f6866154ebad5a571dfb96e81754988d534b36c5b3af4984ba6bd394bd1634b5',\
        \ 'tools/release/qf01-browser.mjs': '0ac72b2de6d36209a8b5738c783e53d443b89c4405fb314170ec1b2f404cb667', 'tools/release/qf01-publish-check.test.mjs':\
        \ 'fb69c6b537d6db5249b2fab09cc22b9506cd863e559c1fcba2a2dfb23657b2d5', 'tools/release/qf01-retained-adapters.test.mjs':\
        \ 'b8083c5c439be39e2e089556c287b1cbac5084955e0040c8c609ad34ec16418a'}\n\ndef require(ok,message):\n    if not ok:\
        \ raise RuntimeError(message)\ndef sha(raw):return hashlib.sha256(raw).hexdigest()\ndef unique_pairs(pairs):\n   \
        \ result={}\n    for key,value in pairs:\n        require(key not in result,'duplicate JSON key')\n        result[key]=value\n\
        \    return result\ndef parse(raw):return json.loads(raw,object_pairs_hook=unique_pairs)\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \    def redirect_request(self,req,fp,code,msg,headers,newurl):\n        raise RuntimeError('Unexpected API redirect')\n\
        opener=urllib.request.build_opener(NoRedirect)\n\ndef api(path,data=None):\n    require(path.startswith('/') or path=='','fixed\
        \ repo-relative API only')\n    raw=None if data is None else json.dumps(data,separators=(',',':'),ensure_ascii=False).encode()\n\
        \    req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=raw,headers={\n        'Authorization':'Bearer\
        \ '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',\n        'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='GET'\
        \ if data is None else 'POST')\n    with opener.open(req,timeout=45) as response:\n        body=response.read(9*1024*1024+1);require(len(body)<=9*1024*1024,'bounded\
        \ API response')\n        return response.status,parse(body) if body else None\n\ndef content(path,expected):\n  \
        \  _,item=api('/contents/'+path+'?ref='+MAIN)\n    require(item['type']=='file' and item['path']==path and item['encoding']=='base64','immutable\
        \ source file')\n    raw=base64.b64decode(item['content'],validate=False)\n    require(len(raw)<=1024*1024,'bounded\
        \ immutable source')\n    require(sha(raw)==expected,'exact immutable publisher bytes '+path)\n    require(hashlib.sha1(b'blob\
        \ '+str(len(raw)).encode()+b'\\0'+raw).hexdigest()==item['sha'],'Git blob binding '+path)\n    return raw\n\ndef current_main_and_workflow():\n\
        \    _,main=api('/git/ref/heads/main');require(main['object']['sha']==MAIN,'live main must remain exact successful\
        \ producer')\n    content(WORKFLOW,WORKFLOW_SHA)\n\ndef no_existing_dispatch():\n    _,runs=api('/actions/workflows/'+str(WORKFLOW_ID)+'/runs?event=workflow_dispatch&head_sha='+MAIN+'&per_page=100')\n\
        \    require(runs['total_count']==0 and runs['workflow_runs']==[], 'existing dispatch: reconcile read-only instead\
        \ of sending')\n\nrequire(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REPOSITORY_ID']==str(REPO_ID),'repository\
        \ context')\nrequire(os.environ['GITHUB_REF']=='refs/heads/'+BRANCH,'isolated operational branch only')\nrequire(os.environ['GITHUB_EVENT_NAME']=='push'\
        \ and os.environ['GITHUB_RUN_ATTEMPT']=='1','first push attempt only; no reruns')\nevent=parse(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())\n\
        require(event['repository']['id']==REPO_ID and event['repository']['owner']['id']==OWNER_ID and event['sender']['id']==OWNER_ID,'target\
        \ sender/owner identity')\nrequire(event['after']==os.environ['GITHUB_SHA'] and not event.get('deleted'),'push commit\
        \ binding')\nrequire(re.fullmatch('[0-9a-f]{64}',REQUEST_SHA),'draft cannot run')\nraw=Path(REQUEST).read_bytes();require(sha(raw)==REQUEST_SHA,'exact\
        \ frozen request bytes')\nrequest=parse(raw)\nrequire(request['schemaVersion']=='qf01-one-shot-p045-dispatch/1' and\
        \ request['status']=='READY_WITH_ACTUAL_G2_AND_DEPLOY','actual request only')\nrequire(b'__REQUIRES_' not in raw and\
        \ b'UNBOUND' not in raw,'future authority placeholders are forbidden')\nrequire(request['repository']==REPO and request['repositoryID']==REPO_ID\
        \ and request['ownerID']==OWNER_ID,'request repo scope')\nrequire(request['publisherSHA']==MAIN and request['sourceSHA']==SOURCE,'source\
        \ and publisher separation')\nrequire(request['producer']=={'runID':PRODUCER,'attempt':ATTEMPT,'headBranch':PRODUCER_BRANCH},'fixed\
        \ new successful producer')\nrequire(request['publisherPins']==PUBLISHER_PINS,'exact seven approved immutable files')\n\
        inputs=request['dispatch']['inputs']\nrequire(request['dispatch']['ref']=='main' and inputs['dry_run']=='false' and\
        \ inputs['verified_run_id']==str(PRODUCER) and inputs['verified_attempt']==str(ATTEMPT),'fixed same-action dispatch')\n\
        require(set(inputs)=={'dry_run','verified_run_id','verified_attempt','native_intent_chain'},'exact input keys')\n\
        require(len(json.dumps(inputs,ensure_ascii=False).encode())<65535 and len(json.dumps(inputs,ensure_ascii=False))<65535,'no\
        \ truncated inputs')\nref=parse(inputs['native_intent_chain'])\nrequire(ref==request['nativeAuthorityBlobRef'],'identical\
        \ immutable blob reference')\nrequire(ref['schemaVersion']=='qf01-native-authority-blob-ref/1' and ref['repository']==REPO\
        \ and ref['encoding']=='gzip-base64','same-repo native blob only')\nrequire(set(ref)=={'schemaVersion','repository','blobSHA','blobSHA256','encoding','expandedSHA256'},'exact\
        \ blob reference schema')\nrequire(re.fullmatch('[0-9a-f]{40}',ref['blobSHA']) and all(re.fullmatch('[0-9a-f]{64}',ref[k])\
        \ for k in ['blobSHA256','expandedSHA256']),'fixed blob hashes')\nexpected=request['nativeExpected']\nrequire(set(expected)=={'operationID','eventHash','sourceSHA','work','releaseUnit','proposalHash','materialProposalHash','technicalProposalHash','technicalWork','publisherSHA','g2Artifact','mergeOperationID','distManifestSHA256'},'exact\
        \ native expectation')\nrequire(expected['work']=='W-MATH-QF01-FULL-RELEASE-P035-20261115' and expected['releaseUnit']=='qf01-p035'\
        \ and expected['sourceSHA']==SOURCE and expected['proposalHash']==PROPOSAL_SHA,'current approved material authority')\n\
        require(isinstance(expected['operationID'],str) and expected['operationID'] and all(re.fullmatch('[0-9a-f]{64}',expected[k])\
        \ for k in ['eventHash','proposalHash','materialProposalHash','technicalProposalHash','g2Artifact','distManifestSHA256']),'actual\
        \ native operation/evidence hashes')\nrequire(expected['materialProposalHash']==PROPOSAL_SHA and expected['technicalWork']=='W-TECH-QF01-PUBLISHER-P045-20261116'\
        \ and expected['technicalProposalHash']=='b10699d089ff0a824aba0065c2e3fe438ab51c605819ed9910ade3fa96cfc00b' and expected['publisherSHA']==MAIN,'separate\
        \ approved material/technical/publisher binding')\nrequire(expected['distManifestSHA256']==request['distManifestSHA256']\
        \ and isinstance(expected['mergeOperationID'],str) and expected['mergeOperationID'],'actual merge and sealed artifact\
        \ binding')\n# Read-only exact-two operational helper proof, separate from unchanged main publisher.\n_,helper=api('/git/commits/'+os.environ['GITHUB_SHA'])\n\
        require([x['sha'] for x in helper['parents']]==[MAIN],'helper exact sole parent is already merged publisher')\n_,delta=api('/compare/'+MAIN+'...'+os.environ['GITHUB_SHA'])\n\
        require(delta['status']=='ahead' and delta['total_commits']==1 and delta['ahead_by']==1 and delta['behind_by']==0\
        \ and len(delta['files'])==2 and {x['filename'] for x in delta['files']}=={WORKFLOW,REQUEST},'isolated exact-two helper\
        \ only; never merge helper')\n_,repo=api('');require(repo['id']==REPO_ID and repo['owner']['id']==OWNER_ID and repo['default_branch']=='main','live\
        \ target identity')\n_,workflow=api('/actions/workflows/'+str(WORKFLOW_ID));require(workflow['id']==WORKFLOW_ID and\
        \ workflow['path']==WORKFLOW and workflow['state']=='active','existing workflow identity')\ncurrent_main_and_workflow()\n\
        _,producer=api('/actions/runs/'+str(PRODUCER))\nrequire(producer['workflow_id']==WORKFLOW_ID and producer['id']==PRODUCER\
        \ and producer['run_attempt']==ATTEMPT and producer['head_sha']==MAIN and producer['event']=='push' and producer['head_branch']==PRODUCER_BRANCH\
        \ and producer['path']==WORKFLOW and producer['status']=='completed' and producer['conclusion']=='success','exact\
        \ completed producer')\n_,jobs=api('/actions/runs/'+str(PRODUCER)+'/attempts/'+str(ATTEMPT)+'/jobs?per_page=100')\n\
        require(jobs['total_count']==8 and len(jobs['jobs'])==8 and len({j['id'] for j in jobs['jobs']})==8,'complete unpaginated\
        \ eight producer jobs')\nrequire(all(j['status']=='completed' for j in jobs['jobs']),'producer jobs complete')\nrequire({j['name']\
        \ for j in jobs['jobs'] if j['conclusion']=='success'}=={'build','qa (320)','qa (390)','qa (430)','qa (1440)','attest'},'six\
        \ verified successful jobs')\nrequire({j['name'] for j in jobs['jobs'] if j['conclusion']=='skipped'}=={'publish','hosted'},'producer\
        \ did not publish')\nno_existing_dispatch()\n\n# Fetch only fixed, already approved publisher code. No app build/install/patch.\n\
        snapshot=Path('_immutable_publisher_for_authority')\nrequire(not snapshot.exists(),'fresh immutable validation snapshot')\n\
        for path,expected_sha in PUBLISHER_PINS.items():\n    target=snapshot/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content(path,expected_sha))\n\
        Path('REQUEST_FOR_AUTHORITY_CHECK.json').write_bytes(raw)\n# Verify the separate actual runtime and hydrate build\
        \ seed before final-intent validation.\n# Build seed and final envelope are different immutable blobs and separate\
        \ bounded GETs.\nnode_script=\"\"\"import fs from 'node:fs';\nimport path from 'node:path';import os from 'node:os';import\
        \ assert from 'node:assert/strict';\nimport {verifyCoreBinding,hydrateBuildAuthority,hydrateNativeAuthority,validateNativeIntent}\
        \ from './_immutable_publisher_for_authority/tools/release/qf01-publish-check.mjs';\nconst request=JSON.parse(fs.readFileSync('REQUEST_FOR_AUTHORITY_CHECK.json'));\n\
        const contract=JSON.parse(fs.readFileSync('_immutable_publisher_for_authority/tools/release/qf01-publish-contract.json'));\n\
        assert.equal(contract.currentNativeAuthority.definitionHash,'26b3bb5b0f9c5e84732389961fffe03638b7c3e6ed1095158faf7b60b5f3ecb9');\n\
        assert.equal(contract.currentNativeAuthority.implementationHash,'f96679fe99b11e048f5252b470f372fe8cf28dc821451e0c62205564ba4fe6cd');\n\
        const core=verifyCoreBinding({coreRoot:process.env.CORE_ROOT,materialRoot:process.env.SOURCE_ROOT,contract});\nconst\
        \ privateDir=fs.mkdtempSync(path.join(os.tmpdir(),'qf01-p045-dispatch-build-'));fs.chmodSync(privateDir,0o700);\n\
        const cacheFile=path.join(privateDir,'BUILD_AUTHORITY.raw');assert.ok(path.isAbsolute(cacheFile));\nprocess.env.BUILD_AUTHORITY_CACHE=cacheFile;\n\
        await hydrateBuildAuthority(contract,{cacheFile:process.env.BUILD_AUTHORITY_CACHE,token:process.env.GH_TOKEN});\n\
        const envelope=await hydrateNativeAuthority(request.nativeAuthorityBlobRef,{token:process.env.GH_TOKEN});\nconst actual=validateNativeIntent(envelope,contract,{\n\
        \ publisherSHA:request.publisherSHA,publisherFiles:request.publisherPins,\n producerRunID:request.producer.runID,producerAttempt:request.producer.attempt,\n\
        \ distManifestSHA256:request.distManifestSHA256\n});\nfs.writeFileSync('CORE_BINDING_FOR_DISPATCH.json',JSON.stringify(core.proof,null,2)+String.fromCharCode(10));\n\
        fs.writeFileSync('NATIVE_AUTHORITY_VALIDATION.json',JSON.stringify(actual,null,2)+String.fromCharCode(10));\n\"\"\"\
        \nsubprocess.run(['node','--input-type=module','-e',node_script],check=True,timeout=120)\nactual=parse(Path('NATIVE_AUTHORITY_VALIDATION.json').read_bytes())\n\
        require(actual==expected,'exact actual G2/DEPLOY authority; never substitute older operation')\n# Recheck immediately\
        \ before the sole POST. This is not an atomic ref lock;\n# same-publisher target and returned head must both remain\
        \ exact.\nno_existing_dispatch();current_main_and_workflow()\nreceipt_file=Path('DISPATCH_RECEIPT.json')\nbase={'operationID':expected['operationID'],'publisherSHA':MAIN,'sourceSHA':SOURCE,'helperSHA':os.environ['GITHUB_SHA'],'helperRun':os.environ['GITHUB_RUN_ID'],'requestSHA256':sha(raw),'nativeAuthorityBlobRef':ref,'nativeEventHash':expected['eventHash'],'g2Artifact':expected['g2Artifact'],'producerRun':PRODUCER,'producerAttempt':ATTEMPT,'noAutomaticRetry':True}\n\
        receipt_file.write_text(json.dumps({**base,'status':'SINGLE_POST_ATTEMPT_STARTING'},indent=2)+chr(10))\ntry:\n   \
        \ status,receipt=api('/actions/workflows/'+str(WORKFLOW_ID)+'/dispatches',{**request['dispatch'],'return_run_details':True})\n\
        except Exception as ex:\n    receipt_file.write_text(json.dumps({**base,'status':'AMBIGUOUS_RECONCILE_READ_ONLY','errorType':type(ex).__name__},indent=2)+chr(10))\n\
        \    raise RuntimeError('Dispatch response unknown: read-only reconciliation, no resending') from None\nreceipt_file.write_text(json.dumps({**base,'status':'RESPONSE_RECEIVED_NOT_DEPLOYMENT_PROOF','httpStatus':status,'receipt':receipt},indent=2)+chr(10))\n\
        require(status==200 and isinstance(receipt,dict) and type(receipt.get('workflow_run_id')) is int and receipt['workflow_run_id']>0,'ambiguous\
        \ dispatch: do not retry')\nrunid=receipt['workflow_run_id']\nrequire(receipt['run_url']=='https://api.github.com/repos/'+REPO+'/actions/runs/'+str(runid),'fixed\
        \ result API URL')\nrequire(receipt['html_url']=='https://github.com/'+REPO+'/actions/runs/'+str(runid),'fixed result\
        \ HTML URL')\n_,child=api('/actions/runs/'+str(runid))\nobserved={'id':child['id'],'workflow_id':child['workflow_id'],'head_sha':child['head_sha'],'head_branch':child['head_branch'],'event':child['event'],'path':child['path'],'run_attempt':child['run_attempt'],'repositoryID':child['repository']['id']}\n\
        receipt_file.write_text(json.dumps({**base,'status':'ACTUAL_CHILD_OBSERVED_NOT_DEPLOYMENT_PROOF','httpStatus':status,'receipt':receipt,'actualRun':observed,'dispatchActorID':child.get('actor',{}).get('id')},indent=2)+chr(10))\n\
        require(observed=={'id':runid,'workflow_id':WORKFLOW_ID,'head_sha':MAIN,'head_branch':'main','event':'workflow_dispatch','path':WORKFLOW,'run_attempt':1,'repositoryID':REPO_ID},'child\
        \ binding differs: no retry')\n# Built-in GitHubActions bot actor is expected for GITHUB_TOKEN dispatch (P010 observed\n\
        # actor41898282). It is distinct from the checked human owner/sender, not a new login.\nprint(json.dumps({'operationID':expected['operationID'],'dispatchedRunID':runid,'publisherSHA':MAIN,'sourceSHA':SOURCE,'html_url':receipt['html_url']}))\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qf01-p016-one-shot-dispatch-receipt-${{ github.run_id }}
        path: 'DISPATCH_RECEIPT.json

          NATIVE_AUTHORITY_VALIDATION.json

          '
        if-no-files-found: warn
