name: QF01 revision3 current-core publisher P046-R3
'on':
  push:
    branches:
    - work/qf01-p046-r3-publisher-20261116
    - work/qf01-p046-r3-design-preview-20261116
    - work/qf01-checkpoint-recovery-publisher-20261122
    paths:
    - .github/workflows/qf01-publisher-g3.yml
    - tools/release/qf01-*
  workflow_dispatch:
    inputs:
      design_preview:
        type: boolean
        default: false
        required: false
        description: Draft design images only; no native gates, seal, producer ledger or publication
      dry_run:
        type: boolean
        default: true
        required: true
        description: Verification-only by default; false consumes an already successful immutable PUSH build
      verified_run_id:
        type: string
        required: false
        default: ''
        description: Successful PUSH verification run ID at this exact publisher commit
      verified_attempt:
        type: string
        required: false
        default: '1'
        description: Successful immutable producer attempt
      native_intent_chain:
        type: string
        required: false
        default: ''
        description: Exact same-repo native-authority-blob-ref/1 JSON; authenticated immutable Git blob hydrates current P046-R3
          material authority from actual post-apply export; historical10391 proof stays separate
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.ref == 'refs/heads/work/qf01-p046-r3-design-preview-20261116' && 'qf01-r3-design-preview' || 'pages' }}
  cancel-in-progress: false
jobs:
  checkpoint_linux:
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/qf01-checkpoint-recovery-publisher-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # D06 source_ci preparation uses this exact public core; historical D3 remains separate.
      CHECKPOINT_CORE_SHA: 438e479bac1a9875525e460fc4593af732a9a95c
      CHECKPOINT_CURRENT_TEST_COUNT: 269
      # Historical P11 assertion repair and test inventory; D05 runs its own current suite.
      CHECKPOINT_TEST_HARNESS_SHA: c0be347fdc2bcf8f749aff1518c4620955ee93d3
      CHECKPOINT_TEST_RUNTIME_SHA256: 2f9cc760f1430fae665b26fa0e0d36b077bab690f0201fb3ace67f0bfb92e92d
      CHECKPOINT_BASELINE_REPAIR_SHA: 247cb09b1d852d4e4fa469b3d74fb29bee053c53
      CHECKPOINT_MATH_BASELINE_SHA: 900642faf76267546c5c7420b7d50a010516ca6e
      CHECKPOINT_MIXED_BASELINE_SHA: 249cc8ee4648bc86897e66e3c9b5847e5592e5c1
      CHECKPOINT_AUTHORITY_SHA: 55d844f20c0de3390ad6718ee8d01968ebbb8676
      CHECKPOINT_ORIGIN_SOURCE_SHA: 1f10ecbcd088ca8636932c8df4c7b85293777efc
      CHECKPOINT_AUTHORITY_BLOB_SHA: ccb58fd71a927953093a567dc9732d6730fdda12
      CHECKPOINT_FIXTURE_SHA: 9ee19f65d39b3e639857c809ada50a01c8a7c322
      CHECKPOINT_LEGACY_SHA: 0401a9241671011c415f91f7f429368e80438037
      CHECKPOINT_PROPOSAL_PATH: work/items/W-TECH-QF01-CHECKPOINT-RECOVERY-20261122/PROPOSAL.md
      ACTUAL_REPOSITORY_ID: ${{ github.repository_id }}
      CHECKPOINT_DIAGNOSTICS: /tmp/qf01-checkpoint-linux
      QF01_CHECKPOINT_INPUT_ROOT: /tmp/qf01-checkpoint-test-input
      QF01_CHECKPOINT_SOURCE_ROOT: ${{ github.workspace }}/fixture-source
      QF01_CHECKPOINT_BASELINE_REPAIR_ROOT: ${{ github.workspace }}/repair-baseline
      QF01_CHECKPOINT_MATH_BASELINE_ROOT: ${{ github.workspace }}/math-baseline
      QF01_CHECKPOINT_MIXED_BASELINE_ROOT: ${{ github.workspace }}/mixed-baseline
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/core:${{ github.workspace }}/core/workflow
      GIT_NO_LAZY_FETCH: '1'
      GIT_OPTIONAL_LOCKS: '0'
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
    steps:
    - name: Reject unbound immutable checkpoint inputs
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json, os, re
        from pathlib import Path
        out = Path(os.environ['CHECKPOINT_DIAGNOSTICS'])
        out.mkdir(parents=True, exist_ok=True)
        keys = ('CHECKPOINT_CORE_SHA', 'CHECKPOINT_TEST_HARNESS_SHA', 'CHECKPOINT_BASELINE_REPAIR_SHA', 'CHECKPOINT_MATH_BASELINE_SHA', 'CHECKPOINT_MIXED_BASELINE_SHA', 'CHECKPOINT_AUTHORITY_SHA', 'CHECKPOINT_ORIGIN_SOURCE_SHA',
                'CHECKPOINT_AUTHORITY_BLOB_SHA', 'CHECKPOINT_FIXTURE_SHA', 'CHECKPOINT_LEGACY_SHA')
        pins = {key: os.environ[key] for key in keys}
        valid = (os.environ['GITHUB_REPOSITORY'] == 'rrikunagasige-dot/kyotsu-step-web'
                 and os.environ['ACTUAL_REPOSITORY_ID'] == '1391122224'
                 and all(re.fullmatch(r'[0-9a-f]{40}', pins[key]) for key in keys)
                 and pins['CHECKPOINT_BASELINE_REPAIR_SHA'] == '247cb09b1d852d4e4fa469b3d74fb29bee053c53'
                 and pins['CHECKPOINT_MATH_BASELINE_SHA'] == '900642faf76267546c5c7420b7d50a010516ca6e'
                 and pins['CHECKPOINT_MIXED_BASELINE_SHA'] == '249cc8ee4648bc86897e66e3c9b5847e5592e5c1'
                 and pins['CHECKPOINT_CORE_SHA'] != pins['CHECKPOINT_MIXED_BASELINE_SHA']
                 and pins['CHECKPOINT_CORE_SHA'] not in (pins['CHECKPOINT_BASELINE_REPAIR_SHA'], pins['CHECKPOINT_MATH_BASELINE_SHA'])
                 and pins['CHECKPOINT_TEST_HARNESS_SHA'] != pins['CHECKPOINT_CORE_SHA']
                 and os.environ['CHECKPOINT_CURRENT_TEST_COUNT'] == '269'
                 and re.fullmatch(r'[0-9a-f]{64}', os.environ['CHECKPOINT_TEST_RUNTIME_SHA256']) is not None
                 and pins['CHECKPOINT_AUTHORITY_SHA'] == '55d844f20c0de3390ad6718ee8d01968ebbb8676'
                 and pins['CHECKPOINT_ORIGIN_SOURCE_SHA'] == '1f10ecbcd088ca8636932c8df4c7b85293777efc'
                 and pins['CHECKPOINT_AUTHORITY_BLOB_SHA'] == 'ccb58fd71a927953093a567dc9732d6730fdda12'
                 and pins['CHECKPOINT_FIXTURE_SHA'] == '9ee19f65d39b3e639857c809ada50a01c8a7c322'
                 and pins['CHECKPOINT_LEGACY_SHA'] == '0401a9241671011c415f91f7f429368e80438037')
        report = {'schemaVersion': 'qf01-checkpoint-linux-input-pins/1',
                  'publisherSHA': os.environ['GITHUB_SHA'], 'pins': pins, 'bound': bool(valid),
                  'testFixturesOnly': True, 'nativeBootstrapPerformed': False, 'gateAccepted': False}
        (out / 'PINS.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        if not valid:
            raise SystemExit('Public checkpoint source pins are unbound or repository identity differs')
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
            stream.write('VITE_PREVIEW_COMMIT=' + pins['CHECKPOINT_CORE_SHA'] + '\n')
        PY
    - name: Checkout the immutable current core and application candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_CORE_SHA }}
        path: core
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout the separately pinned test-only expectation revision
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_TEST_HARNESS_SHA }}
        path: checkpoint-test-harness
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout unchanged immutable B repair bytes for historical fixtures
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_BASELINE_REPAIR_SHA }}
        path: repair-baseline
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout unchanged immutable C bytes for D04 predecessor fixtures
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_MATH_BASELINE_SHA }}
        path: math-baseline
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout unchanged immutable D3 bytes for D05 predecessor fixtures
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_MIXED_BASELINE_SHA }}
        path: mixed-baseline
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout this exact publisher candidate for compatibility tests
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: checkpoint-publisher
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout the unchanged original source fixture
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_FIXTURE_SHA }}
        path: fixture-source
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout the already public immutable authority source
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_AUTHORITY_SHA }}
        path: authority-source
        fetch-depth: 0
        persist-credentials: false
    - name: Read the exact historical graph fixture for the existing compatibility test
      uses: actions/checkout@v4
      with:
        ref: ${{ env.CHECKPOINT_LEGACY_SHA }}
        path: legacy-fixture
        fetch-depth: 0
        persist-credentials: false
    - name: Bind the current D05 suite and retained P11 attack cases
      id: test_harness
      shell: bash
      run: |
        set -euo pipefail
        python -X utf8 -B - <<'PY'
        import ast, hashlib, json, os, subprocess
        from pathlib import Path
        from checkpoint import current_core_identity
        w=Path(os.environ['GITHUB_WORKSPACE']); core=w/'core'; historical=w/'checkpoint-test-harness'
        target=os.environ['CHECKPOINT_CORE_SHA']; harness=os.environ['CHECKPOINT_TEST_HARNESS_SHA']
        def git(root,*args):return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
        for directory,expected in [(core,target),(historical,harness)]:
            assert git(directory,'rev-parse','HEAD')==expected
            assert git(directory,'remote','get-url','origin').removesuffix('.git')=='https://github.com/rrikunagasige-dot/kyotsu-step-web'
            assert git(directory,'diff','--name-only','HEAD')==''
        assert git(core,'merge-base',harness,target)==harness, 'D05 must retain the actual C0 test repair in its ancestry'
        assert git(historical,'rev-parse',harness+'^')==os.environ['CHECKPOINT_MIXED_BASELINE_SHA'], 'Historical C0 must remain the original D3 test-only child'
        assert git(historical,'diff','--name-status','--no-renames',os.environ['CHECKPOINT_MIXED_BASELINE_SHA'],harness)=='M\tworkflow/test_checkpoint_runtime.py'
        test_path='workflow/test_checkpoint_runtime.py'
        sha=lambda raw:hashlib.sha256(raw).hexdigest()
        old=(historical/test_path).read_bytes(); current=(core/test_path).read_bytes()
        assert sha(old)==os.environ['CHECKPOINT_TEST_RUNTIME_SHA256']
        required={('InformedReviewMethodTests','test_technical_owner_head_inventory_and_original_scope_fail_without_writes'),('NearbyReviewMethodTests','test_third_protected_path_change_refuses_owner_reconciliation'),('MathRenderingOwnerTests','test_third_protected_hash_cannot_enter_current_d04_owner')}
        def methods(raw):
            return {(c.name,m.name):ast.dump(m,include_attributes=False) for c in ast.parse(raw).body if isinstance(c,ast.ClassDef) for m in c.body if isinstance(m,ast.FunctionDef) and (c.name,m.name) in required}
        assert methods(old)==methods(current) and set(methods(current))==required, 'The three corrected attack cases must remain unchanged'
        identity=current_core_identity()
        historical_files={name:sha((historical/'workflow'/name).read_bytes()) for name in identity['files']}
        assert all(wanted==sha((w/'mixed-baseline/workflow'/name).read_bytes()) for name,wanted in historical_files.items()), 'Historical D3/C0 implementation bytes must remain identical'
        report={'schemaVersion':'qf01-checkpoint-current-suite-binding/1','targetCoreSHA':target,'testHarnessSHA':harness,'testRuntimePath':test_path,'targetTestRuntimeSHA256':sha(current),'testHarnessRuntimeSHA256':sha(old),'core':identity,'historicalWorkflowFiles':historical_files,'historicalInventoryArtifactSHA256':'91e72b6f360fcded32460e805767e0d1bc0333e1b2a85db81bd17ce0d9eaae78','retainedTestIDs':['test_checkpoint.ActualCheckpointTailTests.test_append_payload_and_return_values_are_detached', 'test_checkpoint.ActualCheckpointTailTests.test_append_two_events_and_reopen_existing_tail', 'test_checkpoint.ActualCheckpointTailTests.test_artifact_byte_limit_includes_newline_at_exact_boundary', 'test_checkpoint.ActualCheckpointTailTests.test_artifact_noncanonical_and_duplicate_json_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_cas_stale_head_rejects_without_second_append', 'test_checkpoint.ActualCheckpointTailTests.test_changed_lock_owner_is_preserved_and_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_child_junction_is_rejected_after_init_and_on_reopen', 'test_checkpoint.ActualCheckpointTailTests.test_corrupt_artifact_is_rejected_and_never_overwritten', 'test_checkpoint.ActualCheckpointTailTests.test_create_binds_actual_checkpoint_without_original_prefix', 'test_checkpoint.ActualCheckpointTailTests.test_event_byte_limit_includes_newline_at_exact_boundary', 'test_checkpoint.ActualCheckpointTailTests.test_event_id_length_and_invalid_values', 'test_checkpoint.ActualCheckpointTailTests.test_existing_lock_fails_closed_without_pid_guess_or_removal', 'test_checkpoint.ActualCheckpointTailTests.test_existing_namespace_and_native_shaped_directory_are_not_overwritten', 'test_checkpoint.ActualCheckpointTailTests.test_expected_head_is_required_and_typed', 'test_checkpoint.ActualCheckpointTailTests.test_failed_link_leaves_partial_tmp_and_blocks_retry', 'test_checkpoint.ActualCheckpointTailTests.test_known_prefix_ids_are_rejected_without_writing', 'test_checkpoint.ActualCheckpointTailTests.test_origin_tampering_is_rejected_on_live_instance_and_reopen', 'test_checkpoint.ActualCheckpointTailTests.test_original_work_cannot_be_opened_again', 'test_checkpoint.ActualCheckpointTailTests.test_other_work_fixture_does_not_establish_known_state', 'test_checkpoint.ActualCheckpointTailTests.test_partial_event_tmp_blocks_reads_and_append', 'test_checkpoint.ActualCheckpointTailTests.test_put_get_content_hash_and_reopen', 'test_checkpoint.ActualCheckpointTailTests.test_real_subprocesses_compete_for_one_expected_head', 'test_checkpoint.ActualCheckpointTailTests.test_root_replaced_by_junction_is_rejected_after_init', 'test_checkpoint.ActualCheckpointTailTests.test_same_id_different_content_or_work_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_same_id_same_content_is_idempotent_at_current_cas', 'test_checkpoint.ActualCheckpointTailTests.test_seed_artifact_fallback_and_no_redundant_copy', 'test_checkpoint.ActualCheckpointTailTests.test_swapped_child_directory_symlink_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_symlink_artifact_is_rejected_without_target_modification', 'test_checkpoint.ActualCheckpointTailTests.test_symlink_event_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_symlink_root_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_tampered_event_filename_or_content_is_rejected', 'test_checkpoint.ActualCheckpointTailTests.test_unknown_artifact_and_invalid_reference_are_rejected', 'test_checkpoint.ActualCheckpointTests.test_actual_fixed_identity_and_all_objects', 'test_checkpoint.ActualCheckpointTests.test_actual_summary_does_not_claim_runtime_or_acceptance', 'test_checkpoint.ActualCheckpointTests.test_all_object_return_values_are_detached', 'test_checkpoint.ActualCheckpointTests.test_authentic_team_subset_has_real_envelopes_and_explicit_limits', 'test_checkpoint.ActualCheckpointTests.test_bad_foreign_event_cannot_be_filtered_out', 'test_checkpoint.ActualCheckpointTests.tes