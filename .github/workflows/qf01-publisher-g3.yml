    - name: Derive TEST_FIXTURE inputs from already public source data
      id: inputs
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        python -X utf8 -B - <<'PY'
        import base64, copy, hashlib, json, os, subprocess, sys, urllib.parse, urllib.request
        from pathlib import Path
        from checkpoint import (ORIGIN_NAMES, CURRENT_REPAIR_AFTER, RECOVERY_PROPOSAL_SHA256,
                                FIXED_CONTRACT_SHA256, FIXED_WORK, canonical, digest,
                                decode_gzip, strict_json, current_core_identity, load_qf01_checkpoint)
        EXPECTED_ORIGIN_HASHES = {
            'APPROVED_MATERIAL_SEED.json': '6ef587967d4761c27741c540d3320200dd64adb1c2ed3479bd1e2a9092aaad1e',
            'BUILD_AUTHORITY.blob': '14586a74f6465dab9051c766cbed26e1f3a1b0cbcef657c8e9fae8fdc42a63c6',
            'FEEDBACK_PROJECTION.json': 'ed8d6faea49b5dc33d6359c1fb43e1a7d873a0d748cc1435c05fd65d40be100a',
            'KNOWN_PREFIX_ENVELOPES.json': '35013768d32f67012c55c46a88a8f2d497a4f6540a02e5b51be76e79bce5c21e',
            'NODES.json': 'ef75121487346fe0cc24d9903d096082d98facc2c23472b3dc98d816cbeb110c',
            'ORIGIN_SOURCE_PROOF.json': 'bdf5ab50fe2870c0e77c553dd089f221968635e6b5c5480a41ce1e1016e9473b',
            'ORIGIN_SOURCE_SNAPSHOT.json': '08d0e50a4a8bf7c7f823f016a7389b02815285334902da09d037e7ad98e88b2a',
            'TEAM_PREFIX_SUBSET.json': 'f2225ffd09a1e92e332f2bff82c87408af4d1a2ecf19a76c4ccbd27c6342bc41',
            'publisher-contract.json': 'b5f49f53b3895a8169f817a91efd376b4e73b17526d5b08bcb77e2b7fa4aee30'}
        def public_json(route):
            assert route.startswith(('/git/blobs/', '/contents/')) and '://' not in route
            token = os.environ.get('GH_TOKEN')
            assert token, 'Authenticated read token required'
            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, request, file, code, message, headers, new_url):
                    return None
            url = 'https://api.github.com/repos/rrikunagasige-dot/kyotsu-step-web' + route
            request = urllib.request.Request(url, method='GET', headers={
                'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token,
                'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'qf01-checkpoint-public-fixture-read'})
            with urllib.request.build_opener(NoRedirect()).open(request, timeout=30) as response:
                assert response.status == 200 and response.geturl() == url, 'Public source read differs'
                assert int(response.headers.get('Content-Length', '0')) <= 8 * 1024 * 1024
                raw = response.read(8 * 1024 * 1024 + 1)
            assert len(raw) <= 8 * 1024 * 1024, 'Public API response exceeds bound'
            return strict_json(raw)
        def decode_blob(payload, wanted):
            assert payload['sha'] == wanted and payload['encoding'] == 'base64'
            assert type(payload['size']) is int and 0 < payload['size'] <= 5 * 1024 * 1024
            encoded = payload['content'].replace('\n', '')
            raw = base64.b64decode(encoded, validate=True)
            assert base64.b64encode(raw).decode('ascii') == encoded and len(raw) == payload['size']
            assert hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest() == wanted
            return raw
        def derive_public_inputs(authority_root, supplied, proposal, origin_source_sha, read_json):
            assert origin_source_sha == '1f10ecbcd088ca8636932c8df4c7b85293777efc'
            contract_path = authority_root / 'tools/release/qf01-publish-contract.json'
            contract_raw = contract_path.read_bytes()
            assert hashlib.sha256(contract_raw).hexdigest() == FIXED_CONTRACT_SHA256
            blob_sha = 'ccb58fd71a927953093a567dc9732d6730fdda12'
            blob = decode_blob(read_json('/git/blobs/' + blob_sha), blob_sha)
            assert hashlib.sha256(blob).hexdigest() == EXPECTED_ORIGIN_HASHES['BUILD_AUTHORITY.blob']
            expanded = decode_gzip(blob.decode('ascii'), 20 * 1024 * 1024)
            assert hashlib.sha256(expanded).hexdigest() == EXPECTED_ORIGIN_HASHES['APPROVED_MATERIAL_SEED.json']
            supplied.mkdir(parents=True, exist_ok=False)
            for name, raw in [('publisher-contract.json', contract_raw), ('BUILD_AUTHORITY.blob', blob)]:
                with (supplied / name).open('xb') as stream:
                    stream.write(raw)
            view = load_qf01_checkpoint(supplied / 'publisher-contract.json', supplied / 'BUILD_AUTHORITY.blob')
            state = view.state_snapshot(FIXED_WORK)
            assert state['plan']['source_sha'] == origin_source_sha
            original_blobs = {
                'src/components/textbook/GuidedMathReadingFlow.tsx': '472d5306b607ce89977e99283a598ef44133002a',
                'src/data/textbook/math/quadratic/qf01Lesson.test.tsx': 'e668d363e64d35ae5b18406d6942857b454afb56'}
            assert set(state['plan']['source_manifest']) == set(original_blobs)
            rows, files_hex = [], {}
            for name, wanted in state['plan']['source_manifest'].items():
                route = '/contents/' + urllib.parse.quote(name, safe='/') + '?ref=' + origin_source_sha
                payload = read_json(route)
                assert payload.get('type') == 'file' and payload.get('path') == name
                raw = decode_blob(payload, original_blobs[name])
                assert hashlib.sha256(raw).hexdigest() == wanted
                files_hex[name] = raw.hex()
                rows.append({'path': name, 'bytes': len(raw), 'sha256': wanted,
                             'gitBlobSHA': original_blobs[name]})
            snapshot = {'source_sha': origin_source_sha, 'files_hex': files_hex}
            snapshot_raw = canonical(snapshot)
            assert digest(snapshot) == EXPECTED_ORIGIN_HASHES['ORIGIN_SOURCE_SNAPSHOT.json']
            proof = {
                'schemaVersion': 'qf01-git-origin-source-recovery/1',
                'qualification': 'Newly reconstructed from verified original Git bytes. Not recovery of the old opened envelope or a native receipt.',
                'repository': 'rrikunagasige-dot/kyotsu-step-web', 'repositoryId': 1391122224,
                'work': FIXED_WORK, 'sourceSHA': origin_source_sha, 'checkpointAnchor': view.anchor,
                'sourceManifest': copy.deepcopy(state['plan']['source_manifest']), 'files': rows,
                'snapshotSHA256': digest(snapshot), 'snapshotBytes': len(snapshot_raw),
                'originalOpenedEventRecovered': False, 'nativeStoreWritten': False}
            files = {
                'publisher-contract.json': contract_raw, 'BUILD_AUTHORITY.blob': blob,
                'APPROVED_MATERIAL_SEED.json': expanded, 'NODES.json': canonical(view.nodes()),
                'ORIGIN_SOURCE_PROOF.json': (json.dumps(proof, ensure_ascii=False, indent=2) + '\n').encode('utf-8'),
                'ORIGIN_SOURCE_SNAPSHOT.json': snapshot_raw,
                'TEAM_PREFIX_SUBSET.json': canonical(view.team_prefix_subset(FIXED_WORK)['events']),
                'KNOWN_PREFIX_ENVELOPES.json': canonical(view.known_prefix_envelope_subset()['events']),
                'FEEDBACK_PROJECTION.json': canonical(view.feedback_payload_projection(FIXED_WORK)['rows'])}
            hashes = {name: hashlib.sha256(raw).hexdigest() for name, raw in files.items()}
            assert set(files) == set(ORIGIN_NAMES) and hashes == EXPECTED_ORIGIN_HASHES, 'Derived public origin bytes differ'
            records = []
            for name, raw in sorted(files.items()):
                target = supplied / name
                if target.exists():
                    assert target.read_bytes() == raw
                else:
                    with target.open('xb') as stream:
                        stream.write(raw)
                row = {'name': name, 'copy': str(target), 'bytes': len(raw), 'sha256': hashes[name],
                       'provenance': 'TEST_FIXTURE_DERIVED_FROM_ALREADY_PUBLIC_AUTHORITY'}
                if name == 'publisher-contract.json':
                    row['source'] = str(contract_path)
                records.append(row)
            proposal_raw = proposal.read_bytes()
            assert hashlib.sha256(proposal_raw).hexdigest() == RECOVERY_PROPOSAL_SHA256
            with (supplied / 'PROPOSAL.md').open('xb') as stream:
                stream.write(proposal_raw)
            records.append({'name': 'PROPOSAL.md', 'source': str(proposal),
                            'copy': str(supplied / 'PROPOSAL.md'), 'bytes': len(proposal_raw),
                            'sha256': RECOVERY_PROPOSAL_SHA256, 'provenance': 'ALREADY_PUBLIC_ADOPTED_PROPOSAL'})
            assert {path.name for path in supplied.iterdir()} == set(ORIGIN_NAMES) | {'PROPOSAL.md'}
            return records, view, hashes
        workspace = Path(os.environ['GITHUB_WORKSPACE'])
        out = Path(os.environ['CHECKPOINT_DIAGNOSTICS'])
        def git(directory, *args):
            return subprocess.check_output(['git', '-C', str(directory), *args], text=True).strip()
        expected = {'core': os.environ['CHECKPOINT_CORE_SHA'],
                    'checkpoint-test-harness': os.environ['CHECKPOINT_TEST_HARNESS_SHA'],
                    'repair-baseline': os.environ['CHECKPOINT_BASELINE_REPAIR_SHA'],
                    'math-baseline': os.environ['CHECKPOINT_MATH_BASELINE_SHA'],
