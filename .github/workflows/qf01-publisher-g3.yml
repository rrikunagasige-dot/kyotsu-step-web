        import hashlib, json, os, sys, unittest
        from pathlib import Path
        import checkpoint
        out=Path(os.environ['CHECKPOINT_DIAGNOSTICS'])
        binding=json.loads((out/'TEST_HARNESS_BINDING.json').read_text(encoding='utf-8'))
        w=Path(os.environ['GITHUB_WORKSPACE']); target=w/'core'; harness=w/'checkpoint-test-harness'
        def module_bindings():
            result={}
            for name,wanted in binding['core']['files'].items():
                for root in (target,):
                    assert hashlib.sha256((root/'workflow'/name).read_bytes()).hexdigest()==wanted
                module=sys.modules.get(name[:-3])
                if module is not None:
                    actual=Path(module.__file__).resolve()
                    assert actual == (target/'workflow'/name).resolve()
                    assert hashlib.sha256(actual.read_bytes()).hexdigest()==wanted
                    result[name]={'path':str(actual),'sha256':wanted}
            return result
        before=module_bindings()
        suite=unittest.defaultTestLoader.discover('workflow',pattern='test_checkpoint*.py')
        def flatten(s):
            for t in s:
                if isinstance(t,unittest.TestSuite): yield from flatten(t)
                else: yield t
        ids=[t.id() for t in flatten(suite)]
        assert len(ids)==len(set(ids))==binding['expectedCurrentTestCount'] and set(binding['retainedTestIDs']).issubset(ids) and set(binding['retainedD05TestIDs']).issubset(ids), 'All269 current tests,179 P11 and207 D05 cases must execute once'
        assert Path(sys.modules['test_checkpoint_runtime'].__file__).resolve()==(target/binding['testRuntimePath']).resolve()
        (out/'CHECKPOINT_TEST_INVENTORY.json').write_text(json.dumps({'targetCoreSHA':binding['targetCoreSHA'],'testHarnessSHA':binding['testHarnessSHA'],'testIDs':ids,'count':len(ids)},indent=2)+'\n',encoding='utf-8')
        result=unittest.TextTestRunner(verbosity=2).run(suite)
        after=module_bindings()
        assert hashlib.sha256((target/binding['testRuntimePath']).read_bytes()).hexdigest()==binding['targetTestRuntimeSHA256']
        (out/'CHECKPOINT_EXECUTION_BINDING.json').write_text(json.dumps({'targetCoreSHA':binding['targetCoreSHA'],'testHarnessSHA':binding['testHarnessSHA'],'testRuntimeSHA256':binding['targetTestRuntimeSHA256'],'loadedImplementationModulesBefore':before,'loadedImplementationModulesAfter':after,'coreImplementationFiles24Unchanged':True,'testsRun':result.testsRun,'successful':result.wasSuccessful(),'nativeStoreReadOrWritten':False},indent=2)+'\n',encoding='utf-8')
        raise SystemExit(0 if result.wasSuccessful() else 1)
