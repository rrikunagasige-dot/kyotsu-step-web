name: Repository Governance Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/repo-governance-check.mjs
      - run: node --test tests/governance/review-delivery-policy.test.mjs tests/governance/review-work-intake.test.mjs
      - if: github.event_name == 'pull_request'
        run: node tools/review-work-intake.mjs
