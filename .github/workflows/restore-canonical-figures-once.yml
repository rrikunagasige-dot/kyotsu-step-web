name: Restore canonical Chapter 1 figures once

on:
  push:
    paths:
      - '.github/workflows/restore-canonical-figures-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout persistent source archive
        run: |
          git clone --depth 1 --branch source-archives "https://github.com/${GITHUB_REPOSITORY}.git" source-archives

      - name: Reconstruct and verify canonical figure.zip
        run: |
          cat source-archives/archives/figure.zip/figure.zip.part*.b64 | tr -d '\r\n' | base64 --decode > /tmp/figure.zip
          echo "b1d55eb94c13aa8ec91dbfd794dcbcbcec9c5a67ed8bdd692c397ad78d8b01e2  /tmp/figure.zip" | sha256sum --check
          mkdir -p /tmp/canonical-figures
          unzip -q /tmp/figure.zip -d /tmp/canonical-figures

      - name: Install image converter
        run: python -m pip install --quiet pillow

      - name: Re-export the original 17 figures at source resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_root = Path('/tmp/canonical-figures')
          mappings = {
              '1.png': 'public/assets/physics/textbook/ch01/1a/position-vector-displacement.webp',
              '2 (2).png': 'public/assets/physics/textbook/ch01/1a/average-instantaneous-velocity.webp',
              '3 (2).png': 'public/assets/physics/textbook/ch01/1a/curve-velocity-directions.webp',
              '4.png': 'public/assets/physics/textbook/ch01/1a/displacement-components.webp',
              '5.png': 'public/assets/physics/textbook/ch01/1b/velocity-composition.webp',
              '6.png': 'public/assets/physics/textbook/ch01/1b/velocity-components.webp',
              '7.png': 'public/assets/physics/textbook/ch01/1c/relative-velocity-cars.webp',
              '8.png': 'public/assets/physics/textbook/ch01/1c/relative-rain-bicycle.webp',
              '9.png': 'public/assets/physics/textbook/ch01/1d/acceleration-trajectory.webp',
              '10.png': 'public/assets/physics/textbook/ch01/1d/velocity-change-acceleration.webp',
              '11.png': 'public/assets/physics/textbook/ch01/1e/horizontal-projectile-strobe.webp',
              '12.png': 'public/assets/physics/textbook/ch01/1e/horizontal-projectile-velocity.webp',
              '13.png': 'public/assets/physics/textbook/ch01/1f/oblique-projectile-trajectory.webp',
              '14.png': 'public/assets/physics/textbook/ch01/1f/oblique-projectile-components.webp',
              '15.png': 'public/assets/physics/textbook/ch01/1g/gravity-vs-air-resistance.webp',
              '16.png': 'public/assets/physics/textbook/ch01/1g/drag-force-stages.webp',
              '17.png': 'public/assets/physics/textbook/ch01/1g/terminal-velocity-graph.webp',
          }

          for source_name, target_name in mappings.items():
              matches = list(source_root.rglob(source_name))
              if len(matches) != 1:
                  raise RuntimeError(f'{source_name}: expected one source, found {len(matches)}')
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(matches[0]) as image:
                  image.convert('RGB').save(target, 'WEBP', quality=92, method=6)
                  print(f'{source_name} -> {target}  {image.width}x{image.height}')
          PY

      - name: Commit restored original figures
        run: |
          rm -rf source-archives
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/physics/textbook/ch01
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git commit -m "assets: restore high-resolution canonical Chapter 1 figures"
          git push origin HEAD:main
