name: Review Preview Code Check (not a deployment)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Existing unrelated repository-wide lint debt is outside this approved task.
      - run: pnpm exec eslint src/review/reviewTargets.ts src/review/reviewTargets.test.ts src/review/ReviewTextbookPage.tsx src/pages/TextbookUnitPage.tsx e2e/review-preview-gate.spec.ts e2e/review-p003-visual-evidence.spec.ts e2e/review-p003-cross-block.spec.ts e2e/review-p003-related-mobile.spec.ts --max-warnings=0
      # The legacy global suite has two unrelated catalog-count assertion failures.
      - run: pnpm exec vitest run src/review/reviewTargets.test.ts src/data/textbook/math/numbers/n01Lesson.test.ts src/data/textbook/math/numbers/numbersPilots.test.ts src/data/textbook/math/mathReviewIntegrity.test.ts
      - run: pnpm run build
      # This checks actual interaction ONLY on a dedicated PR #92-derived review
      # candidate. The main-based governance branch lacks the seven new holes.
      - name: Install Chromium for N01/N03 pilot
        if: ${{ (github.base_ref == 'work/W-MATH-005-P002-n01-n03-20261018' || github.base_ref == 'work/W-GOV-008-P001-pr92-review-pilot-20261019' || github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019') }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Review interaction gate on PR92-derived branch
        if: ${{ (github.base_ref == 'work/W-MATH-005-P002-n01-n03-20261018' || github.base_ref == 'work/W-GOV-008-P001-pr92-review-pilot-20261019' || github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019') }}
        env:
          E2E_REVIEW_PREVIEW: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-preview-gate.spec.ts --project=mobile-chromium --project=desktop-chromium

      # P-003 Gate ②: cross-check both units at 320px and 390px with wrong/retry,
      # source/answer invariants and unaffected ordinary route, without deployment.
      - name: Cross-block audit for N01/N03 and unaffected routes
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_CROSS: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-cross-block.spec.ts --project=mobile-chromium --project=desktop-chromium

      # P-003 Gate ②: inspect all math/choice right ends while actually solving
      # related approved review lessons at 320px, then completed view at 390px.
      - name: Related math creation mobile formula audit
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_RELATED: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-related-mobile.spec.ts --project=mobile-chromium
      # P-003 pilot: screenshot genuine, numbered in-app marks from exact PR head.
      # Read-only GitHub-hosted runner, no Pages/Vercel publish or branch push.
      - name: Capture seven actual marked decisions as screenshot evidence
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_EVIDENCE: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-visual-evidence.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Store limited-lifetime visual evidence (not a public app)
        if: ${{ always() && github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        uses: actions/upload-artifact@v4
        with:
          name: wgov008-p003-actual-screen-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 1

  # W-MATH-003 N04-Q01: genuine screenshots for this independent PR only.
  n04-q01-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/W-MATH-003-n04-q01-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_REVIEW_EVIDENCE: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture five real marked interactions on phone and desktop
        run: pnpm exec playwright test e2e/review-p003-visual-evidence.spec.ts --grep n04-q01 --project=mobile-chromium --project=desktop-chromium
      - name: Retain fallback evidence without deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n04-q01-genuine-screen-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/n04-q01-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Place exact-commit images only on the PR head branch
        run: |
          evidence_dir="work/items/W-MATH-003-numbers-expressions-creation/evidence/n04-q01"
          mkdir -p "$evidence_dir"
          for number in 1 2 3 4 5; do
            cp "e2e-evidence/n04-q01-review-${number}-mobile-390.png" "$evidence_dir/confirm-${number}-mobile.png"
            cp "e2e-evidence/n04-q01-review-${number}-desktop-1440.png" "$evidence_dir/confirm-${number}-desktop.png"
          done
          {
            printf '# N04-Q01 — 実画面・確認①〜⑤\n\n'
            printf '描画・操作した教材コードの完全SHA: %s\n\n' "$CAPTURE_SHA"
            printf '画像は上のSHAから実際に起動したアプリの各穴の選択直前を撮影。図面・モックではありません。\n\n'
            for number in 1 2 3 4 5; do
              printf '## 確認%s\n\n![確認%s スマホ実画面](confirm-%s-mobile.png)\n\n[PC画面](confirm-%s-desktop.png)\n\n' "$number" "$number" "$number" "$number"
            done
            printf '細部の視覚確認のみ。main統合・本番公開・新規公開環境・課金は未承認。\n'
          } > "$evidence_dir/README.md"
          git add "$evidence_dir"
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N04-Q01 marked screenshots [review only]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"


  # W-MATH-017/P-003 — reuse W-GOV-008's exact-SHA, numbered in-app Gate① method.
  # Only this review PR. Never publish Pages, merge main or change learner progress.
  n11-p007-q08-q09-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/W-MATH-017-p003-inline-prose-correction-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_WM017_GATE1: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Avoid re-capturing evidence-only PR head (prevents recursion)
        id: need
        shell: bash
        run: |
          if git log -1 --format=%s | grep -q '^Store genuine N11 P007 Gate1 images'; then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm run typecheck && pnpm run build
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture actual numbered learner decisions (320/390/1440px)
        if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright test e2e/wmath017-n11-p007-gate1.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Preserve raw screenshot artifact even on test failure
        if: ${{ always() && steps.need.outputs.capture == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wmath017-real-gate1-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit real screenshot sheet to independent PR branch only
        if: ${{ success() && steps.need.outputs.capture == 'true' }}
        shell: bash
        run: |
          dir="work/items/W-MATH-017-n11-arithmetic-learner-operations/evidence/p007-gate1"
          mkdir -p "$dir"
          cp e2e-evidence/p007-* "$dir/"
          {
            printf '# W-MATH-017/P-007 — N11 Q08〜Q09 実アプリ Gate①\n\n'
            printf '対象教材コード SHA: \`%s\`\n\n' "$CAPTURE_SHA"
            printf '実Chromiumで通常のN11をQ01から順に解いた画像と、新しいQ08/Q09だけの番号付き確認画像。320・390・1440px。図面・モックではありません。\n\n'
            printf '## 通常の学習画面（黄色い確認枠なし）\n\n'
            for part in q08-left-before q08-right-before q08-arithmetic-before q09-direction-before q09-quotient-before q09-finished; do
              printf '### %s\n\n![通常画面 %s 390px](p007-normal-%s-390.png)\n\n[320px](p007-normal-%s-320.png) ・ [PC1440px](p007-normal-%s-1440.png)\n\n' "$part" "$part" "$part" "$part" "$part"
            done
            printf '## 今回だけの番号付き確認（Q08・Q09）\n\n'
            printf '**確認①** 左右の引き算を同じ式の中で選べる。**確認②** 左右で同じ数を引く理由。**確認③** 右辺の計算。**確認④** 負の数で割る理由。**確認⑤** 不等号の向きと商の計算。\n\n'
            for i in 1 2 3 4 5; do
              printf '### Q08〜Q09 小操作 %s\n\n' "$i"
              for state in before wrong resolved; do
                printf '**%s**\n\n![%s 390px](p007-review-step-%s-%s-390.png)\n\n[320px](p007-review-step-%s-%s-320.png) ・ [PC1440px](p007-review-step-%s-%s-1440.png)\n\n' "$state" "$state" "$i" "$state" "$i" "$state" "$i" "$state"
              done
            done
            printf 'P-006 Q05〜Q06は既にBLOCK-VISUAL-OKであり再承認対象外。今回新たな対象はQ08・Q09のみ。Gate②・Gate③は別です。\n'
          } > "$dir/README.md"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N11 P007 Gate1 images [review only]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
