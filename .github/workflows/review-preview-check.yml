name: Review Preview Code Check (not a deployment)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Existing unrelated repository-wide lint debt is outside this approved task.
      - run: pnpm exec eslint src/review/reviewTargets.ts src/review/reviewTargets.test.ts src/review/ReviewTextbookPage.tsx src/pages/TextbookUnitPage.tsx e2e/review-preview-gate.spec.ts e2e/review-p003-visual-evidence.spec.ts e2e/review-p003-cross-block.spec.ts e2e/review-p003-related-mobile.spec.ts --max-warnings=0
      # The legacy global suite has two unrelated catalog-count assertion failures.
      - run: pnpm exec vitest run src/review/reviewTargets.test.ts src/data/textbook/math/numbers/n01Lesson.test.ts src/data/textbook/math/numbers/numbersPilots.test.ts src/data/textbook/math/mathReviewIntegrity.test.ts
      - run: pnpm run build
      # This checks actual interaction ONLY on a dedicated PR #92-derived review
      # candidate. The main-based governance branch lacks the seven new holes.
      - name: Install Chromium for N01/N03 pilot
        if: ${{ (github.base_ref == 'work/W-MATH-005-P002-n01-n03-20261018' || github.base_ref == 'work/W-GOV-008-P001-pr92-review-pilot-20261019' || github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019') }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Review interaction gate on PR92-derived branch
        if: ${{ (github.base_ref == 'work/W-MATH-005-P002-n01-n03-20261018' || github.base_ref == 'work/W-GOV-008-P001-pr92-review-pilot-20261019' || github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019') }}
        env:
          E2E_REVIEW_PREVIEW: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-preview-gate.spec.ts --project=mobile-chromium --project=desktop-chromium

      # P-003 Gate ②: cross-check both units at 320px and 390px with wrong/retry,
      # source/answer invariants and unaffected ordinary route, without deployment.
      - name: Cross-block audit for N01/N03 and unaffected routes
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_CROSS: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-cross-block.spec.ts --project=mobile-chromium --project=desktop-chromium

      # P-003 Gate ②: inspect all math/choice right ends while actually solving
      # related approved review lessons at 320px, then completed view at 390px.
      - name: Related math creation mobile formula audit
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_RELATED: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-related-mobile.spec.ts --project=mobile-chromium
      # P-003 pilot: screenshot genuine, numbered in-app marks from exact PR head.
      # Read-only GitHub-hosted runner, no Pages/Vercel publish or branch push.
      - name: Capture seven actual marked decisions as screenshot evidence
        if: ${{ github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        env:
          E2E_REVIEW_EVIDENCE: '1'
          E2E_USE_PREVIEW: '1'
        run: pnpm exec playwright test e2e/review-p003-visual-evidence.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Store limited-lifetime visual evidence (not a public app)
        if: ${{ always() && github.base_ref == 'work/W-GOV-008-P002-marked-review-20261019' }}
        uses: actions/upload-artifact@v4
        with:
          name: wgov008-p003-actual-screen-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 1

  # W-MATH-003 N04-Q01: genuine screenshots for this independent PR only.
  n04-q01-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/W-MATH-003-n04-q01-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_REVIEW_EVIDENCE: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck && pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture five real marked interactions on phone and desktop
        run: pnpm exec playwright test e2e/review-p003-visual-evidence.spec.ts --grep n04-q01 --project=mobile-chromium --project=desktop-chromium
      - name: Retain fallback evidence without deploying
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n04-q01-genuine-screen-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/n04-q01-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Place exact-commit images only on the PR head branch
        run: |
          evidence_dir="work/items/W-MATH-003-numbers-expressions-creation/evidence/n04-q01"
          mkdir -p "$evidence_dir"
          for number in 1 2 3 4 5; do
            cp "e2e-evidence/n04-q01-review-${number}-mobile-390.png" "$evidence_dir/confirm-${number}-mobile.png"
            cp "e2e-evidence/n04-q01-review-${number}-desktop-1440.png" "$evidence_dir/confirm-${number}-desktop.png"
          done
          {
            printf '# N04-Q01 — 実画面・確認①〜⑤\n\n'
            printf '描画・操作した教材コードの完全SHA: %s\n\n' "$CAPTURE_SHA"
            printf '画像は上のSHAから実際に起動したアプリの各穴の選択直前を撮影。図面・モックではありません。\n\n'
            for number in 1 2 3 4 5; do
              printf '## 確認%s\n\n![確認%s スマホ実画面](confirm-%s-mobile.png)\n\n[PC画面](confirm-%s-desktop.png)\n\n' "$number" "$number" "$number" "$number"
            done
            printf '細部の視覚確認のみ。main統合・本番公開・新規公開環境・課金は未承認。\n'
          } > "$evidence_dir/README.md"
          git add "$evidence_dir"
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N04-Q01 marked screenshots [review only]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"


  # W-MATH-017/P-003 — reuse W-GOV-008's exact-SHA, numbered in-app Gate① method.
  # Only this review PR. Never publish Pages, merge main or change learner progress.
  n14-wmath018-q10-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/W-MATH-017-p003-inline-prose-correction-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_WM018_GATE1: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Avoid re-capturing evidence-only PR head (prevents recursion)
        id: need
        shell: bash
        run: |
          if git log -1 --format=%s | grep -q '^Store genuine N14 Q10 P002 Gate1 images'; then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm run typecheck && pnpm run build
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture actual numbered learner decisions (320/390/1440px)
        if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright test e2e/wmath018-n14-q10-gate1.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Preserve raw screenshot artifact even on test failure
        if: ${{ always() && steps.need.outputs.capture == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wmath018-q10-real-gate1-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit real screenshot sheet to independent PR branch only
        if: ${{ success() && steps.need.outputs.capture == 'true' }}
        shell: bash
        run: |
          dir="work/items/W-MATH-018-n14-q10-three-sided-inequality/evidence/p002-gate1"
          mkdir -p "$dir"
          cp e2e-evidence/p002-* "$dir/"
          {
            printf '# W-MATH-018/P-002 — N14 Q10 スマホ横切れ修正・実アプリ細部確認\n\n'
            printf '描画した実教材コードの完全SHA: %s\n\n' "$CAPTURE_SHA"
            printf 'GitHub Actions Chromiumで実画面操作。320/390pxでは第2式の内側scrollWidth、全ての未回答穴の表示領域、幅と高さ、誤答後の↻も検査。1440pxは従来表示を保つ。図面やモックではありません。\n\n'
            printf '## 通常の学習画面（確認用の黄色い枠なし）\n\n'
            for part in left-before addition-2-before addition-3-before left-bound-before right-bound-before final; do
              printf '### %s\n\n![実際の教材 %s 390px](p002-normal-%s-390.png)\n\n[320px](p002-normal-%s-320.png) ・ [PC1440px](p002-normal-%s-1440.png)\n\n' "$part" "$part" "$part" "$part" "$part"
            done
            printf '## 今回だけの変更箇所・確認①〜③\n\n'
            printf '**確認①：** 三辺に同じ数を足す第2式の中に3つの穴が並ぶ。\n\n'
            printf '**確認②：** 三辺に同じ数を足す理由は第2式を解いた後、第3式の前に出る。\n\n'
            printf '**確認③：** 最終行の左端と右端は、それぞれ独立した数値穴になる。\n\n'
            for i in 1 2 3 4 5; do
              printf '### 解答小操作 %s\n\n' "$i"
              for state in before wrong resolved; do
                printf '**%s**\n\n![操作%s %s 390px](p002-review-%s-%s-390.png)\n\n[320px](p002-review-%s-%s-320.png) ・ [PC1440px](p002-review-%s-%s-1440.png)\n\n' "$state" "$i" "$state" "$i" "$state" "$i" "$state" "$i" "$state"
              done
            done
            printf 'N14 Q07/Q08/Q12とN11 P006/P007/P008は既に細部承認済み。今回の確認はN14 Q10のみであり、Gate②横断監査とGate③全体総チェックとは別です。\n'
          } > "$dir/README.md"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N14 Q10 P002 Gate1 images [review only]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi


  # W-MATH-019/P-001: identical native SHA-bound Gate① method as Q10,
  # scoped only to isolated Q14 draft PR. No Pages/public release.
  n14-wmath019-q14-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/W-MATH-019-n14-q14-proposal-20261022' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_WM019_GATE1: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Do not re-capture bot evidence commit
        id: need
        run: |
          # Keep existing genuine source-SHA images after human Gate1 approval.
          # New learner changes must separately reopen the review target before recapture.
          if git log -1 --format=%s | grep -q '^Store genuine N14 Q14 P001 Gate1 images' || \
             (grep -A 12 "  'n14-q14': {" src/review/reviewTargets.ts | grep -q "reviewState:'accepted'"); then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm run typecheck && pnpm run build
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Real 320/390/1440 Q14 review and normal app
        if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright test e2e/wmath019-n14-q14-gate1.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Preserve screenshots even on failure
        if: ${{ always() && steps.need.outputs.capture == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wmath019-q14-real-gate1-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/q14-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve genuine images on PR branch only
        if: ${{ success() && steps.need.outputs.capture == 'true' }}
        run: |
          dir="work/items/W-MATH-019-n14-q14-three-sided-addition/evidence/gate1"
          mkdir -p "$dir"
          cp e2e-evidence/q14-* "$dir/"
          {
            printf '# N14 Q14 genuine Chromium images; not synthetic\n\n'
            printf 'Operated source code SHA: %s\n\n' "$CAPTURE_SHA"
            printf '320px, 390px, 1440px real normal + numbered review screens. Gate1 visual user acceptance PENDING; Gate2 and Gate3 not approved.\n\n'
            for width in 320 390 1440; do
              printf '## %spx\n\n' "$width"
              for state in review-before review-wrong review-bounds normal-before normal-bounds; do
                printf '**%s**\n\n![Real Q14 %s %spx](q14-%s-%s.png)\n\n' "$state" "$state" "$width" "$state" "$width"
              done
            done
            printf 'User requested only concise math layout in the ChatGPT conversation; retain actual images as reproducible technical proof.\n'
          } > "$dir/README.md"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N14 Q14 P001 Gate1 images [review only]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi

  # W-MATH-020/P-001: identical native SHA-bound Gate① method as Q10,
  # scoped only to isolated Q15 draft PR. No Pages/public release.
  n14-wmath020-q15-authentic-screenshots:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/W-MATH-020-n14-q15-proposal-20261022' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_WM020_GATE1: '1'
      E2E_USE_PREVIEW: '1'
      TARGET_BRANCH: ${{ github.head_ref }}
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Do not re-capture bot evidence commit
        id: need
        run: |
          # Keep existing genuine source-SHA images after human Gate1 approval.
          # New learner changes must separately reopen the review target before recapture.
          if git log -1 --format=%s | grep -q '^Store genuine N14 Q15 P001 Gate1 images' || \
             (grep -A 12 "  'n14-q15': {" src/review/reviewTargets.ts | grep -q "reviewState:'accepted'"); then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm run typecheck && pnpm run build
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Real 320/390/1440 Q15 review and normal app
        if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright test e2e/wmath020-n14-q15-gate1.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Preserve screenshots even on failure
        if: ${{ always() && steps.need.outputs.capture == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: wmath020-q15-real-gate1-${{ github.event.pull_request.head.sha }}
          path: e2e-evidence/q15-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve genuine images on PR branch only
        if: ${{ success() && steps.need.outputs.capture == 'true' }}
        run: |
          dir="work/items/W-MATH-020-n14-q15-three-sided-division/evidence/gate1"
          mkdir -p "$dir"
          cp e2e-evidence/q15-* "$dir/"
          {
            printf '# N14 Q15 genuine Chromium images; not synthetic\n\n'
            printf 'Operated source code SHA: %s\n\n' "$CAPTURE_SHA"
            printf '320px, 390px, 1440px real normal + numbered review screens. Gate1 visual user acceptance PENDING; Gate2 and Gate3 not approved.\n\n'
            for width in 320 390 1440; do
              printf '## %spx\n\n' "$width"
              for state in review-before review-wrong review-bounds normal-before normal-bounds; do
                printf '**%s**\n\n![Real Q15 %s %spx](q15-%s-%s.png)\n\n' "$state" "$state" "$width" "$state" "$width"
              done
            done
            printf 'User requested only concise math layout in the ChatGPT conversation; retain actual images as reproducible technical proof.\n'
          } > "$dir/README.md"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Store genuine N14 Q15 P001 Gate1 images [review only]'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi


  # W-MATH-021: verify only the user-approved Q15 CENTER wrong-state hint.
  # The earlier Q15 mathematical Gate1 was already accepted; do not reopen it.
  n14-wmath021-center-hint-real-evidence:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/W-MATH-021-n14-q15-middle-hint-proposal-20261022' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
      VITE_REVIEW_PREVIEW: 'true'
      VITE_BASE_PATH: '/'
      VITE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      E2E_WM021_HINT: '1'
      E2E_USE_PREVIEW: '1'
      CAPTURE_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Avoid recapturing already preserved hint evidence
        id: need
        shell: bash
        run: |
          if git log -1 --format=%s | grep -q '^Store genuine N14 Q15 center hint screenshots' || \
             (test -f work/items/W-MATH-021-n14-q15-middle-hint/evidence/gate1/README.md && \
              grep -Fq 'P-003 four-step hint' work/items/W-MATH-021-n14-q15-middle-hint/evidence/gate1/README.md); then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
          else
            echo 'capture=true' >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - if: ${{ steps.need.outputs.capture == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm run typecheck && pnpm run build
      - if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Real N14 Q15 wrong hint retry, unchanged five stages at 320/390/1440
        if: ${{ steps.need.outputs.capture == 'true' }}
        run: pnpm exec playwright test e2e/wmath021-n14-q15-center-hint.spec.ts --project=mobile-chromium --project=desktop-chromium
      - name: Preserve screenshots on failure too
