<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">周の長さが40cmの長方形</title>
  <desc id="desc">縦の長さをxセンチメートル、横の長さをyセンチメートルとした長方形。</desc>
  <rect x="150" y="90" width="340" height="180" fill="white" stroke="currentColor" stroke-width="5"/>
  <text x="320" y="62" text-anchor="middle" font-family="sans-serif" font-size="30">y cm</text>
  <text x="108" y="190" text-anchor="middle" font-family="sans-serif" font-size="30">x cm</text>
  <text x="320" y="324" text-anchor="middle" font-family="sans-serif" font-size="26">周の長さ 40 cm</text>
</svg>