<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc">
<title id="title">位置ベクトルと変位</title>
<desc id="desc">原点OからP1、P2への位置ベクトルと、P1からP2への変位ベクトルを示す図。</desc>
<defs>
  <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker>
</defs>
<rect width="1100" height="825" fill="white"/>
<line x1="120" y1="715" x2="1010" y2="715" stroke="#111" stroke-width="4" marker-end="url(#arrow-black)"/>
<line x1="120" y1="715" x2="120" y2="90" stroke="#111" stroke-width="4" marker-end="url(#arrow-black)"/>
<circle cx="120" cy="715" r="9" fill="#111"/>
<text x="65" y="770" font-size="54" font-family="Georgia,serif">O</text>
<text x="1025" y="742" font-size="54" font-style="italic" font-family="Georgia,serif">x</text>
<text x="92" y="65" font-size="54" font-style="italic" font-family="Georgia,serif">y</text>

<line x1="126" y1="708" x2="450" y2="415" stroke="#555" stroke-width="5" marker-end="url(#arrow-gray)"/>
<line x1="126" y1="708" x2="855" y2="215" stroke="#555" stroke-width="5" marker-end="url(#arrow-gray)"/>
<line x1="455" y1="410" x2="852" y2="217" stroke="#1976d2" stroke-width="6" marker-end="url(#arrow-blue)"/>

<circle cx="455" cy="410" r="11" fill="#111"/>
<circle cx="858" cy="212" r="11" fill="#111"/>
<text x="407" y="386" font-size="51" font-style="italic" font-family="Georgia,serif">P₁</text>
<text x="865" y="193" font-size="51" font-style="italic" font-family="Georgia,serif">P₂</text>
<text x="240" y="555" font-size="49" font-style="italic" font-family="Georgia,serif">r⃗₁</text>
<text x="555" y="505" font-size="49" font-style="italic" font-family="Georgia,serif">r⃗₂</text>
<text x="585" y="290" font-size="52" font-style="italic" fill="#1976d2" font-family="Georgia,serif">Δr⃗</text>
</svg>