<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc">
<title id="title">平均速度と瞬間速度の向き</title>
<desc id="desc">曲線軌道上のA、P、Bを示し、AからB方向の平均速度とPにおける接線方向の瞬間速度を比較する図。</desc>
<defs>
  <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1976d2"/></marker>
</defs>
<rect width="1100" height="825" fill="white"/>
<path d="M48 690 C 210 510, 360 350, 525 292 C 680 238, 850 165, 1025 185" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="135" cy="600" r="9" fill="#111"/>
<circle cx="528" cy="292" r="9" fill="#111"/>
<circle cx="1025" cy="185" r="9" fill="#111"/>
<text x="126" y="650" font-size="52" font-style="italic" font-family="Georgia,serif">A</text>
<text x="525" y="345" font-size="52" font-style="italic" font-family="Georgia,serif">P</text>
<text x="1020" y="165" font-size="52" font-style="italic" font-family="Georgia,serif">B</text>
<line x1="132" y1="600" x2="1020" y2="188" stroke="#999" stroke-width="3" stroke-dasharray="14 12"/>
<line x1="520" y1="292" x2="755" y2="360" stroke="none"/>
<line x1="515" y1="310" x2="740" y2="205" stroke="#777" stroke-width="3"/>
<line x1="530" y1="291" x2="680" y2="230" stroke="#1976d2" stroke-width="6" marker-end="url(#arrow-blue)"/>
<line x1="520" y1="435" x2="680" y2="355" stroke="#1976d2" stroke-width="6" marker-end="url(#arrow-blue)"/>
<text x="575" y="230" font-size="48" font-style="italic" fill="#111" font-family="Georgia,serif">v</text>
<text x="575" y="480" font-size="48" font-style="italic" fill="#111" font-family="Georgia,serif">v̄</text>
<text x="580" y="140" font-size="34" font-family="system-ui,sans-serif">瞬間速度の向き</text>
<line x1="660" y1="152" x2="630" y2="205" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/>
<text x="700" y="505" font-size="34" font-family="system-ui,sans-serif">平均速度の向き</text>
<line x1="690" y1="475" x2="650" y2="440" stroke="#111" stroke-width="2" marker-end="url(#arrow-black)"/>
</svg>