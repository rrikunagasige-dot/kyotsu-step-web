<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 825" role="img" aria-labelledby="title desc">
<title id="title">変位のx成分とy成分</title>
<desc id="desc">座標平面上のA(x1,y1)からB(x2,y2)への変位と、そのx成分Δx、y成分Δyを示す図。</desc>
<defs>
  <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#888"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1496e8"/></marker>
</defs>
<rect width="1100" height="825" fill="white"/>
<line x1="150" y1="730" x2="1000" y2="730" stroke="#111" stroke-width="4" marker-end="url(#arrow-black)"/>
<line x1="150" y1="730" x2="150" y2="62" stroke="#111" stroke-width="4" marker-end="url(#arrow-black)"/>
<text x="1020" y="755" font-size="54" font-style="italic" font-family="Georgia,serif">x</text>
<text x="128" y="42" font-size="54" font-style="italic" font-family="Georgia,serif">y</text>
<text x="106" y="780" font-size="52" font-family="Georgia,serif">O</text>
<circle cx="390" cy="485" r="10" fill="#111"/>
<circle cx="748" cy="180" r="10" fill="#111"/>
<line x1="390" y1="485" x2="390" y2="730" stroke="#999" stroke-width="3" stroke-dasharray="12 12"/>
<line x1="748" y1="180" x2="748" y2="730" stroke="#999" stroke-width="3" stroke-dasharray="12 12"/>
<line x1="150" y1="485" x2="390" y2="485" stroke="#999" stroke-width="3" stroke-dasharray="12 12"/>
<line x1="150" y1="180" x2="748" y2="180" stroke="#999" stroke-width="3" stroke-dasharray="12 12"/>
<line x1="395" y1="480" x2="744" y2="184" stroke="#1496e8" stroke-width="6" marker-end="url(#arrow-blue)"/>
<line x1="395" y1="485" x2="744" y2="485" stroke="#888" stroke-width="4" marker-end="url(#arrow-gray)"/>
<line x1="748" y1="482" x2="748" y2="188" stroke="#888" stroke-width="4" marker-end="url(#arrow-gray)"/>
<text x="405" y="545" font-size="43" font-family="Georgia,serif">A(x₁,y₁)</text>
<text x="755" y="155" font-size="43" font-family="Georgia,serif">B(x₂,y₂)</text>
<text x="365" y="780" font-size="42" font-style="italic" font-family="Georgia,serif">x₁</text>
<text x="720" y="780" font-size="42" font-style="italic" font-family="Georgia,serif">x₂</text>
<text x="95" y="505" font-size="42" font-style="italic" font-family="Georgia,serif">y₁</text>
<text x="95" y="200" font-size="42" font-style="italic" font-family="Georgia,serif">y₂</text>
<text x="505" y="330" font-size="46" font-style="italic" font-family="Georgia,serif">AB⃗</text>
<text x="575" y="530" font-size="44" font-family="Georgia,serif">Δx</text>
<text x="770" y="350" font-size="44" font-family="Georgia,serif">Δy</text>
</svg>