<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">落下中の力の変化</title><desc id="desc">落下開始直後、中間、終端速度の3段階で重力と空気抵抗の大きさを比較する。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#1f67b1"/></marker></defs><rect width="1080" height="520" fill="#fff"/><g fill="#d8d8d8" stroke="#172737" stroke-width="4"><circle cx="180" cy="210" r="42"/><circle cx="540" cy="210" r="42"/><circle cx="900" cy="210" r="42"/></g><g stroke="#1f67b1" stroke-width="8" marker-end="url(#a)"><line x1="180" y1="255" x2="180" y2="390"/><line x1="540" y1="255" x2="540" y2="390"/><line x1="900" y1="255" x2="900" y2="390"/><line x1="540" y1="165" x2="540" y2="100"/><line x1="900" y1="165" x2="900" y2="55"/></g><g fill="#172737" font-family="system-ui,sans-serif" font-size="27"><text x="105" y="45">落下直後</text><text x="475" y="45">落下中</text><text x="825" y="45">終端速度</text><text x="205" y="335">mg</text><text x="565" y="335">mg</text><text x="925" y="335">mg</text><text x="565" y="125">kv</text><text x="925" y="90">kvₜ</text><text x="80" y="455">抵抗はほぼ0</text><text x="430" y="455">抵抗が増える</text><text x="790" y="455">重力とつり合う</text></g></svg>