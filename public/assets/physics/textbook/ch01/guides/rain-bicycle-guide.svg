<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">雨と自転車の相対速度</title><desc id="desc">鉛直下向きの雨と右向きに進む自転車を速度ベクトルで示す。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#1f67b1"/></marker></defs><rect width="900" height="520" fill="#fff"/><g stroke="#8ab6df" stroke-width="5"><line x1="160" y1="70" x2="110" y2="190"/><line x1="260" y1="45" x2="210" y2="165"/><line x1="360" y1="75" x2="310" y2="195"/></g><circle cx="450" cy="350" r="62" fill="none" stroke="#172737" stroke-width="8"/><circle cx="650" cy="350" r="62" fill="none" stroke="#172737" stroke-width="8"/><path d="M450 350 L540 260 L650 350 M540 260 L575 350 M500 240 L555 240" fill="none" stroke="#172737" stroke-width="8"/><g stroke="#1f67b1" stroke-width="9" marker-end="url(#a)"><line x1="300" y1="250" x2="300" y2="440"/><line x1="475" y1="170" x2="720" y2="170"/></g><g fill="#172737" font-family="system-ui,sans-serif" font-size="30"><text x="205" y="235">雨の速度</text><text x="505" y="150">自転車の速度</text></g></svg>