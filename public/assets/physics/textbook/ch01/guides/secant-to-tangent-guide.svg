<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">曲線上の2点と割線</title>
<desc id="desc">曲線上のP1と近くのP2を結ぶ直線を示す。接線や瞬間速度の答えは表示しない。</desc>
<rect width="900" height="480" fill="#fff"/>
<path d="M80 385 C235 265 360 330 520 210 C635 125 735 115 835 120" fill="none" stroke="#172737" stroke-width="7"/>
<line x1="320" y1="302" x2="565" y2="188" stroke="#1f67b1" stroke-width="7"/>
<g fill="#172737" font-family="system-ui, sans-serif" font-size="34">
<circle cx="320" cy="302" r="10"/><circle cx="565" cy="188" r="10"/>
<text x="270" y="350">P₁</text><text x="580" y="180">P₂</text>
</g>
<g fill="#56616d" font-family="system-ui, sans-serif" font-size="26">
<text x="350" y="245">2点を結ぶ方向</text>
</g></svg>