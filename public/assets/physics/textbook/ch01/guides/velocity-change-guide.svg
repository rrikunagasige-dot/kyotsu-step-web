<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">速度ベクトルの変化</title><desc id="desc">v1とv2を同じ始点から描き、その差が速度変化Δvになることを示す。</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#1f67b1"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L0,10 L11,5 z" fill="#bd4b38"/></marker></defs><rect width="900" height="500" fill="#fff"/><g stroke="#1f67b1" stroke-width="9" marker-end="url(#a)"><line x1="220" y1="360" x2="610" y2="360"/><line x1="220" y1="360" x2="500" y2="145"/></g><line x1="610" y1="360" x2="500" y2="145" stroke="#bd4b38" stroke-width="9" marker-end="url(#b)"/><g fill="#172737" font-family="serif" font-size="42"><text x="390" y="408">v₁</text><text x="330" y="220">v₂</text><text x="560" y="245" fill="#bd4b38">Δv</text></g></svg>