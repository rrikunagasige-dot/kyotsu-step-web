<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">等加速度運動のv-tグラフ</title>
<desc id="desc">時刻0で速度v0、時刻tで速度vとなる直線。傾きが加速度、グラフ下の面積が変位に対応する。</desc>
<rect width="900" height="540" fill="#fff"/>
<g stroke="#172737" stroke-width="4"><line x1="120" y1="455" x2="825" y2="455"/><line x1="120" y1="455" x2="120" y2="65"/></g>
<polygon points="120,365 730,145 730,455 120,455" fill="#dcecf8" opacity=".78"/>
<line x1="120" y1="365" x2="730" y2="145" stroke="#1f67b1" stroke-width="9"/>
<g stroke="#8a8a8a" stroke-width="3" stroke-dasharray="10 8"><line x1="120" y1="365" x2="730" y2="365"/><line x1="730" y1="145" x2="730" y2="455"/></g>
<g fill="#172737" font-family="serif" font-size="36"><text x="78" y="378">v₀</text><text x="88" y="155">v</text><text x="715" y="495">t</text></g>
<g fill="#172737" font-family="system-ui,sans-serif" font-size="27"><text x="430" y="180">傾き → 加速度</text><text x="390" y="410">面積 → 変位</text><text x="830" y="468">時間</text><text x="45" y="55">速度</text></g>
</svg>