<text x="616" y="1816" fill="#172b3a" font-size="17" font-weight="400">。</text>
<rect x="930" y="1736" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="1766" fill="#172b3a" font-size="17" font-weight="400">次の依頼を行う。</text>
<text x="286" y="1893" fill="#46556b" font-size="14" font-weight="400">成果物：完了記録と再開可能な現在地</text>
<text x="40" y="2015" fill="#172b3a" font-size="14" font-weight="400">CODE＝既存プログラムの実行。AIがコードを書く仕事とは区別する。紹介用説明図であり、実行台帳の完了状態を表す図ではない。</text>
