<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1848" viewBox="0 0 1280 1848" role="img" aria-label="修正：指摘から原因・限定修正へ"><style>text{font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}</style><rect width="1280" height="1848" fill="#f7f9fc"/>
<text x="40" y="48" fill="#172b3a" font-size="27" font-weight="700">修正：指摘から原因・限定修正へ</text>
<text x="40" y="82" fill="#172b3a" font-size="17" font-weight="400">修正指摘と肯定評価を同じ分岐へ流さない。</text>
<text x="40" y="129" fill="#172b3a" font-size="16" font-weight="700">工程 / 主担当</text>
<rect x="270" y="105" width="310" height="42" rx="10" fill="#6d48ae"/>
<text x="288" y="133" fill="white" font-size="19" font-weight="700">AI</text>
<rect x="600" y="105" width="310" height="42" rx="10" fill="#175e93"/>
<text x="618" y="133" fill="white" font-size="19" font-weight="700">CODE</text>
<rect x="930" y="105" width="310" height="42" rx="10" fill="#9c5c0e"/>
<text x="948" y="133" fill="white" font-size="19" font-weight="700">USER</text>
<rect x="40" y="168" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="197" fill="#172b3a" font-size="15" font-weight="700">R01_CAPTURE</text>
<text x="54" y="230" fill="#172b3a" font-size="19" font-weight="700">症状の再現・登録</text>
<text x="54" y="321" fill="#6d48ae" font-size="14" font-weight="700">主担当 AI</text>
<rect x="270" y="168" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="198" fill="#172b3a" font-size="17" font-weight="400">ユーザーが困った箇所と、画面上の症</text>
<text x="286" y="223" fill="#172b3a" font-size="17" font-weight="400">状を整理する。</text>
<rect x="600" y="168" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="198" fill="#172b3a" font-size="17" font-weight="400">原版・画像・対象IDを照合。否定的な</text>
<text x="616" y="223" fill="#172b3a" font-size="17" font-weight="400">指摘を修正入力へ渡す。</text>
<rect x="930" y="168" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="198" fill="#172b3a" font-size="17" font-weight="400">困った点や違和感を伝える。</text>
<text x="286" y="325" fill="#46556b" font-size="14" font-weight="400">成果物：症状・対象版・再現手順</text>
<path d="M145 341v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="364" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="393" fill="#172b3a" font-size="15" font-weight="700">R02_CAUSE</text>
<text x="54" y="426" fill="#172b3a" font-size="19" font-weight="700">根本原因の分析</text>
<text x="54" y="517" fill="#6d48ae" font-size="14" font-weight="700">主担当 AI</text>
<rect x="270" y="364" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="394" fill="#172b3a" font-size="17" font-weight="400">意味・文章・数学・教える順のどこが</text>
<text x="286" y="419" fill="#172b3a" font-size="17" font-weight="400">原因か判断する。</text>
<rect x="600" y="364" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="394" fill="#172b3a" font-size="17" font-weight="400">旧形式を識別して診断。属性・接続・</text>
<text x="616" y="419" fill="#172b3a" font-size="17" font-weight="400">描画・参照・過去事例を照合する。</text>
<rect x="930" y="364" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="394" fill="#172b3a" font-size="17" font-weight="400">必要な場合だけ、指摘の意味を補足す</text>
<text x="946" y="419" fill="#172b3a" font-size="17" font-weight="400">る。</text>
<text x="286" y="521" fill="#46556b" font-size="14" font-weight="400">成果物：根本原因と、根拠・未解決点</text>
<path d="M145 537v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="560" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="589" fill="#172b3a" font-size="15" font-weight="700">R03_IMPACT</text>
<text x="54" y="622" fill="#172b3a" font-size="19" font-weight="700">同型不具合の事前監査</text>
<text x="54" y="713" fill="#6d48ae" font-size="14" font-weight="700">主担当 AI</text>
<rect x="270" y="560" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="590" fill="#172b3a" font-size="17" font-weight="400">同じ原因か、別原因か、保護すべき箇</text>
<text x="286" y="615" fill="#172b3a" font-size="17" font-weight="400">所かを判断する。</text>
<rect x="600" y="560" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="590" fill="#172b3a" font-size="17" font-weight="400">全ノードと共有関数のconsumerを列挙</text>
<text x="616" y="615" fill="#172b3a" font-size="17" font-weight="400">。影響表の欠落を検査する。</text>
<rect x="930" y="560" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="590" fill="#172b3a" font-size="17" font-weight="400">この工程の個別承認は不要。</text>
<text x="286" y="717" fill="#46556b" font-size="14" font-weight="400">成果物：影響あり／なし／未確認の対象一覧</text>
<path d="M145 733v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="756" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="785" fill="#172b3a" font-size="15" font-weight="700">R04_PROPOSAL</text>
<text x="54" y="818" fill="#172b3a" font-size="19" font-weight="700">対象限定の具体修正案</text>
<text x="54" y="909" fill="#6d48ae" font-size="14" font-weight="700">主担当 AI</text>
<rect x="270" y="756" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="786" fill="#172b3a" font-size="17" font-weight="400">各ノードの本文・式・穴・参照を具体</text>
<text x="286" y="811" fill="#172b3a" font-size="17" font-weight="400">化し、修正理由を書く。</text>
<rect x="600" y="756" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="786" fill="#172b3a" font-size="17" font-weight="400">原資料coverage、IR、既習、穴、等式</text>
<text x="616" y="811" fill="#172b3a" font-size="17" font-weight="400">、可視状態と保護範囲を検査する。</text>
<rect x="930" y="756" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="786" fill="#172b3a" font-size="17" font-weight="400">実装前に具体案を見る。</text>
<text x="286" y="913" fill="#46556b" font-size="14" font-weight="400">成果物：変更前後・保護対象・実装方法・検査方法</text>
<path d="M145 929v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="952" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="981" fill="#172b3a" font-size="15" font-weight="700">R05_APPROVAL</text>
<text x="54" y="1014" fill="#172b3a" font-size="19" font-weight="700">具体修正案の承認</text>
<text x="54" y="1105" fill="#9c5c0e" font-size="14" font-weight="700">主担当 USER</text>
<rect x="270" y="952" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="982" fill="#172b3a" font-size="17" font-weight="400">承認する内容を説明し、追加変更を混</text>
<text x="286" y="1007" fill="#172b3a" font-size="17" font-weight="400">ぜない。</text>
<rect x="600" y="952" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="982" fill="#172b3a" font-size="17" font-weight="400">案・範囲・添付設計と、実装用IRの対</text>
<text x="616" y="1007" fill="#172b3a" font-size="17" font-weight="400">応を固定する。</text>
<rect x="930" y="952" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="982" fill="#172b3a" font-size="17" font-weight="400">具体案を承認、または修正を指示する</text>
<text x="946" y="1007" fill="#172b3a" font-size="17" font-weight="400">。</text>
<text x="286" y="1109" fill="#46556b" font-size="14" font-weight="400">成果物：修正対象の版・範囲付き承認</text>
<path d="M145 1125v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="1148" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="1177" fill="#172b3a" font-size="15" font-weight="700">R06_PATCH</text>
<text x="54" y="1210" fill="#172b3a" font-size="19" font-weight="700">限定実装</text>
<text x="54" y="1301" fill="#175e93" font-size="14" font-weight="700">主担当 CODE</text>
<rect x="270" y="1148" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="1178" fill="#172b3a" font-size="17" font-weight="400">承認された範囲の実装・コード修正を</text>
<text x="286" y="1203" fill="#172b3a" font-size="17" font-weight="400">行う。</text>
<rect x="600" y="1148" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="1178" fill="#172b3a" font-size="17" font-weight="400">承認hash、差分、生成IR、採点ID・段</text>
<text x="616" y="1203" fill="#172b3a" font-size="17" font-weight="400">階・保存進捗を照合する。</text>
<rect x="930" y="1148" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="1178" fill="#172b3a" font-size="17" font-weight="400">同じ公開許可・画像票承認を繰り返さ</text>
<text x="946" y="1203" fill="#172b3a" font-size="17" font-weight="400">ない。</text>
<text x="286" y="1305" fill="#46556b" font-size="14" font-weight="400">成果物：限定された差分と候補commit</text>
<path d="M145 1321v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="1344" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="1373" fill="#172b3a" font-size="15" font-weight="700">R07_VERIFY</text>
<text x="54" y="1406" fill="#172b3a" font-size="19" font-weight="700">コードによる修正検査</text>
<text x="54" y="1497" fill="#175e93" font-size="14" font-weight="700">主担当 CODE</text>
<rect x="270" y="1344" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="1374" fill="#172b3a" font-size="17" font-weight="400">失敗原因を調べ、修正内容を確認する</text>
<text x="286" y="1399" fill="#172b3a" font-size="17" font-weight="400">。</text>
<rect x="600" y="1344" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="1374" fill="#172b3a" font-size="17" font-weight="400">元の症状、同型箇所、全正誤答、四幅</text>
<text x="616" y="1399" fill="#172b3a" font-size="17" font-weight="400">描画、履歴・再開を実検査する。</text>
<rect x="930" y="1344" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="1374" fill="#172b3a" font-size="17" font-weight="400">この工程の個別承認は不要。</text>
<text x="286" y="1501" fill="#46556b" font-size="14" font-weight="400">成果物：修正・回帰の証拠と実画像</text>
<path d="M145 1517v17m-5-6 5 6 5-6" fill="none" stroke="#8794a6" stroke-width="2"/>
<rect x="40" y="1540" width="210" height="172" rx="12" fill="white" stroke="#d5dce6"/>
<text x="54" y="1569" fill="#172b3a" font-size="15" font-weight="700">R07_SEMANTIC</text>
<text x="54" y="1602" fill="#172b3a" font-size="19" font-weight="700">意味・説明の再監査</text>
<text x="54" y="1693" fill="#6d48ae" font-size="14" font-weight="700">主担当 AI</text>
<rect x="270" y="1540" width="310" height="172" rx="12" fill="#f5f0ff" stroke="#e0e5ee"/>
<text x="286" y="1570" fill="#172b3a" font-size="17" font-weight="400">本当に教える形になったか、元の指摘</text>
<text x="286" y="1595" fill="#172b3a" font-size="17" font-weight="400">が解消したかを実物で審査する。</text>
<rect x="600" y="1540" width="310" height="172" rx="12" fill="#edf6ff" stroke="#e0e5ee"/>
<text x="616" y="1570" fill="#172b3a" font-size="17" font-weight="400">原資料・対象版・可視状態・回帰結果</text>
<text x="616" y="1595" fill="#172b3a" font-size="17" font-weight="400">を対応付ける。</text>
<rect x="930" y="1540" width="310" height="172" rx="12" fill="#fff4e7" stroke="#e0e5ee"/>
<text x="946" y="1570" fill="#172b3a" font-size="17" font-weight="400">この後、公開された実物を評価する。</text>
<text x="286" y="1697" fill="#46556b" font-size="14" font-weight="400">成果物：症状の解消と、説明・保護範囲の監査</text>
<text x="40" y="1819" fill="#172b3a" font-size="14" font-weight="400">CODE＝既存プログラムの実行。AIがコードを書く仕事とは区別する。紹介用説明図であり、実行台帳の完了状態を表す図ではない。</text>
</svg>