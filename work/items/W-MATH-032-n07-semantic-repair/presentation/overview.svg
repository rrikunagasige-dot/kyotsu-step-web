<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="3030" viewBox="0 0 1280 3030"><style>text{font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#77869a"/></marker></defs><rect width="1280" height="3030" fill="#f7f9fc"/>
<text x="40" y="48" fill="#172b3a" font-size="29" font-weight="700">教材制作の火柴図｜AI・CODE・USERの担当</text>
<text x="40" y="84" fill="#172b3a" font-size="17" font-weight="400">AIは意味・教え方・実装を担い、CODEは照合・変換・実検査を担う。USERは具体案と実物を評価する。</text>
<rect x="80" y="125" width="1120" height="175" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="159" fill="#172b3a" font-size="21" font-weight="700">共通 S00–S01：現在地・原本・承認・修正依頼を復元</text>
<text x="103" y="191" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="191" fill="#172b3a" font-size="17" font-weight="400">作成／修正を依頼する</text>
<text x="103" y="219" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="219" fill="#172b3a" font-size="17" font-weight="400">依頼の意図・原資料・既存の教訓を確認する</text>
<text x="103" y="247" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="247" fill="#172b3a" font-size="17" font-weight="400">hash・台帳・残件を照合し、修正を優先して経路を決める</text>
<path d="M640 300 L640 345 L350 345 L350 405" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="110" y="333" fill="#4c5b71" font-size="16" font-weight="700">作成・必須修正なし</text>
<path d="M640 345 L930 345 L930 405" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="333" fill="#4c5b71" font-size="16" font-weight="700">修正・修正優先</text>
<rect x="80" y="405" width="540" height="210" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="439" fill="#172b3a" font-size="21" font-weight="700">C01–C04：原資料・概念・完全解法</text>
<text x="103" y="471" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="471" fill="#172b3a" font-size="17" font-weight="400">内容分析・既習整理・省略のない解法</text>
<text x="103" y="499" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="499" fill="#172b3a" font-size="17" font-weight="400">抽出・対応表・登録済みsolverで検算</text>
<text x="103" y="527" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="527" fill="#172b3a" font-size="17" font-weight="400">制作範囲・学習対象を指定</text>
<rect x="660" y="405" width="540" height="210" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="683" y="439" fill="#172b3a" font-size="21" font-weight="700">R01–R03：再現・原因・影響調査</text>
<text x="683" y="471" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="748" y="471" fill="#172b3a" font-size="17" font-weight="400">症状の意味・根本原因・同型を判断</text>
<text x="683" y="499" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="748" y="499" fill="#172b3a" font-size="17" font-weight="400">版照合・診断・全ノード／consumer列挙</text>
<text x="683" y="527" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="748" y="527" fill="#172b3a" font-size="17" font-weight="400">困った点・違和感を伝える</text>
<path d="M350 615 L350 665" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930 615 L930 665" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="665" width="540" height="210" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="699" fill="#172b3a" font-size="21" font-weight="700">C05：ブロックごとの具体設計</text>
<text x="103" y="731" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="731" fill="#172b3a" font-size="17" font-weight="400">本文・式・穴・誤答・参照・図を設計</text>
<text x="103" y="759" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="759" fill="#172b3a" font-size="17" font-weight="400">IR・依存・coverage・可視状態を検査</text>
<text x="103" y="787" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="787" fill="#172b3a" font-size="17" font-weight="400">次に確認する具体案を受け取る</text>
<rect x="660" y="665" width="540" height="210" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="683" y="699" fill="#172b3a" font-size="21" font-weight="700">R04：対象限定の具体修正案</text>
<text x="683" y="731" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="748" y="731" fill="#172b3a" font-size="17" font-weight="400">各ノードの変更前後と修正理由を示す</text>
<text x="683" y="759" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="748" y="759" fill="#172b3a" font-size="17" font-weight="400">IR・保護範囲・検査計画を照合</text>
<text x="683" y="787" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="748" y="787" fill="#172b3a" font-size="17" font-weight="400">実装前に具体案を見る</text>
<path d="M350 875 L350 905 L640 905 L640 940" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930 875 L930 905 L640 905" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="940" width="1120" height="150" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="974" fill="#172b3a" font-size="21" font-weight="700">C06／R05：具体案の承認</text>
<text x="103" y="1006" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="1006" fill="#172b3a" font-size="17" font-weight="400">内容と範囲を承認、または修正を指示する</text>
<text x="103" y="1034" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="1034" fill="#172b3a" font-size="17" font-weight="400">変更点・残る不確実性を説明する</text>
<text x="103" y="1062" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="1062" fill="#172b3a" font-size="17" font-weight="400">案・添付設計・IR・範囲の対応を固定する</text>
<path d="M640 1090 L640 1135" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="1135" width="1120" height="150" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="1169" fill="#172b3a" font-size="21" font-weight="700">C07／R06：承認範囲の実装</text>
<text x="103" y="1201" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="1201" fill="#172b3a" font-size="17" font-weight="400">承認案に従って実装・コード修正を行う</text>
<text x="103" y="1229" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="1229" fill="#172b3a" font-size="17" font-weight="400">compile・差分適用・意味属性・採点ID・段階・保存進捗を照合する</text>
<text x="103" y="1257" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="1257" fill="#172b3a" font-size="17" font-weight="400">同じ内容・同じ公開許可を再承認しない</text>
<path d="M640 1285 L640 1330" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="1330" width="1120" height="180" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="1364" fill="#172b3a" font-size="21" font-weight="700">C08–C09／R07・G2：実検査と意味・横断監査</text>
<text x="103" y="1396" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="1396" fill="#172b3a" font-size="17" font-weight="400">数理・全回答／誤答・四幅描画・参照・履歴・進捗・保護範囲を検査</text>
<text x="103" y="1424" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="1424" fill="#172b3a" font-size="17" font-weight="400">原資料と実画像で、論理・教え方・文章・穴・回帰を審査する</text>
<text x="103" y="1452" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="1452" fill="#172b3a" font-size="17" font-weight="400">この内部検査の個別承認は不要</text>
<path d="M640 1510 L640 1555" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="1555" width="1120" height="150" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="1589" fill="#172b3a" font-size="21" font-weight="700">G3_HOST：完成単位を既存アプリへ反映</text>
<text x="103" y="1621" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="1621" fill="#172b3a" font-size="17" font-weight="400">検証済みsourceを公開し、manifest・実配信・公開後の操作を照合</text>
<text x="103" y="1649" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="1649" fill="#172b3a" font-size="17" font-weight="400">既存の公開手順を実行し、異常時に原因を調べる</text>
<text x="103" y="1677" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="1677" fill="#172b3a" font-size="17" font-weight="400">既存アプリへの直接URLで、すぐ実物を確認できる</text>
<path d="M640 1705 L640 1750" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="1750" width="1120" height="170" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="1784" fill="#172b3a" font-size="21" font-weight="700">G3_FINAL：実物の範囲付き評価</text>
<text x="103" y="1816" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="1816" fill="#172b3a" font-size="17" font-weight="400">アプリを読み、受入または修正点を伝える</text>
<text x="103" y="1844" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="1844" fill="#172b3a" font-size="17" font-weight="400">評価を対象版・route・範囲へ結び付ける</text>
<text x="103" y="1872" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="1872" fill="#172b3a" font-size="17" font-weight="400">評価の観点を整理する。内部合格をユーザー受入にしない</text>
<path d="M1200 1835 L1256 1835 L1256 510 L1200 510" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1250" y="1500" transform="rotate(-90 1250 1500)" fill="#9c5c0e" font-size="15">USER：修正が必要 → R01</text>
<path d="M640 1920 L640 1985 L350 1985 L350 2530" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160" y="1970" fill="#4c5b71" font-size="16" font-weight="700">受入・作成Work</text>
<path d="M640 1985 L930 1985 L930 2070" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="810" y="1970" fill="#4c5b71" font-size="16" font-weight="700">受入・修正Work</text>
<rect x="660" y="2070" width="540" height="180" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="683" y="2104" fill="#172b3a" font-size="21" font-weight="700">修正後 R03：同型不具合の事後監査</text>
<text x="683" y="2136" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="748" y="2136" fill="#172b3a" font-size="17" font-weight="400">実差分から同型・関連修正の残件を判断</text>
<text x="683" y="2164" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="748" y="2164" fill="#172b3a" font-size="17" font-weight="400">事前表と分け、版・残件の完了を照合</text>
<text x="683" y="2192" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="748" y="2192" fill="#172b3a" font-size="17" font-weight="400">新しい内容変更なら具体案を承認</text>
<path d="M1200 2150 L1230 2150 L1230 545 L1200 545" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1010" y="2040" fill="#4c5b71" font-size="16" font-weight="700">残件あり → 関連修正へ</text>
<path d="M930 2250 L930 2310" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="950" y="2286" fill="#4c5b71" font-size="16" font-weight="700">必須残件なし</text>
<rect x="660" y="2310" width="540" height="150" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="683" y="2344" fill="#172b3a" font-size="21" font-weight="700">R08：修正Episodeを確定</text>
<text x="683" y="2376" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="748" y="2376" fill="#172b3a" font-size="17" font-weight="400">原因・修正・原評価・教訓を整理</text>
<text x="683" y="2404" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="748" y="2404" fill="#172b3a" font-size="17" font-weight="400">否定例・修正版・受入・回帰を結ぶ</text>
<text x="683" y="2432" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="748" y="2432" fill="#172b3a" font-size="17" font-weight="400">追加の個別承認は不要</text>
<path d="M930 2460 L930 2495 L640 2495 L640 2530" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="2530" width="1120" height="200" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="2564" fill="#172b3a" font-size="21" font-weight="700">L01：教訓・事例・機械学習を統合</text>
<text x="103" y="2596" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="2596" fill="#172b3a" font-size="17" font-weight="400">実物への肯定・否定評価が学習の根拠になる</text>
<text x="103" y="2624" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="2624" fill="#172b3a" font-size="17" font-weight="400">何を評価したか・適用範囲・ラベル・次回の教訓を審査</text>
<text x="103" y="2652" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="2652" fill="#172b3a" font-size="17" font-weight="400">版付きcatalog → 漏洩のない入力 → group分割 → fit・評価・重複統合</text>
<text x="103" y="2680" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="2680" fill="#172b3a" font-size="17" font-weight="400">正負不足や評価不能は明記。学習実行と本番採用を区別する</text>
<path d="M640 2730 L640 2775" fill="none" stroke="#77869a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="2775" width="1120" height="150" rx="17" fill="white" stroke="#cbd5e3" stroke-width="2"/>
<text x="103" y="2809" fill="#172b3a" font-size="21" font-weight="700">Z01：終了・保留した作成への復帰</text>
<text x="103" y="2841" fill="#175e93" font-size="16" font-weight="700">CODE</text>
<text x="168" y="2841" fill="#172b3a" font-size="17" font-weight="400">承認・必須残件・証拠・学習記録を照合して閉じる</text>
<text x="103" y="2869" fill="#6d48ae" font-size="16" font-weight="700">AI</text>
<text x="168" y="2869" fill="#172b3a" font-size="17" font-weight="400">現在地と次の作業を整理する</text>
<text x="103" y="2897" fill="#9c5c0e" font-size="16" font-weight="700">USER</text>
<text x="168" y="2897" fill="#172b3a" font-size="17" font-weight="400">次の依頼へ。修正残件がある間は作成へ勝手に進まない</text>
<text x="40" y="2978" fill="#172b3a" font-size="13" font-weight="400">※ CODEはプログラムの実行。AIによるコード執筆とは区別する。別AIによる監査は実施根拠がある場合だけ「独立」と記録する。</text>
</svg>