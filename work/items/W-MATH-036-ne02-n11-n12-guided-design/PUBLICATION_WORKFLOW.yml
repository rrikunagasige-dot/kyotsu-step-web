name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CANDIDATE_SHA: 459a61312e4a050be8c5a39f7d5012e3ab372671
      CODES: ne02,n11,n12
      VITE_PREVIEW_COMMIT: 459a61312e4a050be8c5a39f7d5012e3ab372671
      VITE_STORAGE_NAMESPACE: kyotsu-step-gate3-math-20261023
      VITE_BASE_PATH: /kyotsu-step-web/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 459a61312e4a050be8c5a39f7d5012e3ab372671
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify approved source and protected scope
        run: |
          node --input-type=module <<'NODE'
          process.argv.push('--check');
          import fs from 'node:fs';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const base='work/items/W-MATH-036-ne02-n11-n12-guided-design/',codes=(process.env.CODES??'ne02').split(','),sha=process.env.CANDIDATE_SHA??execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const plan=JSON.parse(fs.readFileSync(base+'WORKFLOW_PLAN.json'));const approval=JSON.parse(fs.readFileSync(base+'APPROVAL.json'));
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==sha)throw Error('source SHA mismatch');for(const [p,h]of Object.entries(plan.protected_manifest))if(createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==h)throw Error('Protected drift '+p);
          for(const code of codes){execFileSync(process.execPath,[base+'materialize.mjs','--check-'+code],{stdio:'inherit'});const d=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/'+code+'Authored.json'));if(d.irHash!==approval.blockHashes[code]||d.proposalHash!==approval.proposalHash)throw Error('approval/content mismatch');}
          if(process.argv.includes('--check')){console.log('exact source/protected/current authored units PASS');process.exit(0);}
          const runtime=JSON.parse(fs.readFileSync('e2e-evidence/chapter-runtime/runtime-units.json'));if(runtime.metadata.sourceSHA!==sha||runtime.units.length!==16)throw Error('runtime source/units mismatch');const design={};for(const code of ['n07','n08','n09','n10',...codes]){const d=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/'+code+'Authored.json'));design[code]=d.irHash??d.repair?.irHash;}
          const m={sourceSHA:sha,workflowSHA:process.env.GITHUB_SHA,storageKey:process.env.VITE_STORAGE_NAMESPACE,work:'W-MATH-036',contentApproval:approval.proposalHash,repairedUnits:codes.map(c=>'math-numbers-expressions-'+c),unitDesignHashes:design,acceptedFirstTitle:'22bc43ba53fa87bb85e82e18a25db13a5c8a485c',acceptedN07:{sourceSHA:'46ea59be61a177bf98edc9f6d26eb6fa7e52b0a6'},acceptedN08:{sourceSHA:'ea47dd97f7d323267281915e8d9a7bb92a8e7c03'},acceptedN09N10:{sourceSHA:'fa0eff271a97940fad08d83960ae50faeabc81b9'},themes:3,units:runtime.units.map(x=>({id:x.unit.unitId,revision:x.unit.revision,items:x.unit.sections.flatMap(s=>s.items.map(q=>q.id))}))};fs.writeFileSync('dist/release.json',JSON.stringify(m,null,2)+'\n');console.log(JSON.stringify({sourceSHA:sha,units:m.repairedUnits}));
          NODE
      - run: pnpm exec vitest run --config work/items/W-MATH-036-ne02-n11-n12-guided-design/vitest.config.mjs
      - run: pnpm exec vitest run --exclude src/data/physicsTaxonomy.test.ts --exclude src/domain/questionSchema.test.ts
      - run: pnpm run test:textbook-authoring
      - run: pnpm run build
      - run: node work/items/W-MATH-003-numbers-expressions-creation/NE01_NE02/export-runtime.mjs
      - name: Write exact-source release manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          const base='work/items/W-MATH-036-ne02-n11-n12-guided-design/',codes=(process.env.CODES??'ne02').split(','),sha=process.env.CANDIDATE_SHA??execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const plan=JSON.parse(fs.readFileSync(base+'WORKFLOW_PLAN.json'));const approval=JSON.parse(fs.readFileSync(base+'APPROVAL.json'));
          if(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==sha)throw Error('source SHA mismatch');for(const [p,h]of Object.entries(plan.protected_manifest))if(createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==h)throw Error('Protected drift '+p);
          for(const code of codes){execFileSync(process.execPath,[base+'materialize.mjs','--check-'+code],{stdio:'inherit'});const d=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/'+code+'Authored.json'));if(d.irHash!==approval.blockHashes[code]||d.proposalHash!==approval.proposalHash)throw Error('approval/content mismatch');}
          if(process.argv.includes('--check')){console.log('exact source/protected/current authored units PASS');process.exit(0);}
          const runtime=JSON.parse(fs.readFileSync('e2e-evidence/chapter-runtime/runtime-units.json'));if(runtime.metadata.sourceSHA!==sha||runtime.units.length!==16)throw Error('runtime source/units mismatch');const design={};for(const code of ['n07','n08','n09','n10',...codes]){const d=JSON.parse(fs.readFileSync('src/data/textbook/math/numbers/'+code+'Authored.json'));design[code]=d.irHash??d.repair?.irHash;}
          const m={sourceSHA:sha,workflowSHA:process.env.GITHUB_SHA,storageKey:process.env.VITE_STORAGE_NAMESPACE,work:'W-MATH-036',contentApproval:approval.proposalHash,repairedUnits:codes.map(c=>'math-numbers-expressions-'+c),unitDesignHashes:design,acceptedFirstTitle:'22bc43ba53fa87bb85e82e18a25db13a5c8a485c',acceptedN07:{sourceSHA:'46ea59be61a177bf98edc9f6d26eb6fa7e52b0a6'},acceptedN08:{sourceSHA:'ea47dd97f7d323267281915e8d9a7bb92a8e7c03'},acceptedN09N10:{sourceSHA:'fa0eff271a97940fad08d83960ae50faeabc81b9'},themes:3,units:runtime.units.map(x=>({id:x.unit.unitId,revision:x.unit.revision,items:x.unit.sections.flatMap(s=>s.items.map(q=>q.id))}))};fs.writeFileSync('dist/release.json',JSON.stringify(m,null,2)+'\n');console.log(JSON.stringify({sourceSHA:sha,units:m.repairedUnits}));
          NODE
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish approved lesson to the existing app
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Exact public source and complete public learner plays
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          let matched=false
          for(let i=0;i<60;i++){
            try{const r=await fetch(process.env.APP_URL+'release.json?sha='+process.env.CANDIDATE_SHA,{cache:'no-store'});const m=await r.json();if(m.sourceSHA===process.env.CANDIDATE_SHA&&m.storageKey===process.env.VITE_STORAGE_NAMESPACE){matched=true;console.log(JSON.stringify(m));break}}catch{}
            await new Promise(r=>setTimeout(r,2000))
          }
          if(!matched)throw Error('public source not verified')
          NODE
          EVIDENCE_DIR=/tmp/w36-hosted node work/items/W-MATH-036-ne02-n11-n12-guided-design/verify_app.mjs
          EVIDENCE_DIR=/tmp/w36-hosted-protected node work/items/W-MATH-035-choice-order-factor-audit/verify_display.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w36-publication-evidence
          path: |
            /tmp/w36-hosted
            /tmp/w36-hosted-protected
